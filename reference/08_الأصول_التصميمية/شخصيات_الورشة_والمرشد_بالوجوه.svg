<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 920" width="1080" height="920" font-family="Tahoma, Arial, sans-serif" direction="rtl" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
