<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>واحة الرياضيات</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- الخط: يُضمَّن ملف Baloo Bhaijaan 2 (OFL) في خطوة البناء عند توفّره (D232)؛ حتى ذلك الحين رابط غير حاجب وبدائل نظام عربية -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap" media="print" onload="this.media='all'">
<style>
/* التصميم: واحة من ورق مقصوص. الأشكال قصاصات بحافة بيضاء وظل ورقي، والنبع يمتلئ بحجارة الشارات (D230).
   شاشة الدرس بلا تمرير: شريط المراحل ← المرشد وفقاعته ← المسرح ← زر واحد بارز. أهداف اللمس 56 والسحب 64 (D246) */
:root {
  --sky-top: #bfe3ee; --sky-bot: #eef8f5; --ground: #ead9b2;
  --paper: #fffdf8; --ink: #1b3440; --muted: #4c6570; --line: #cfe0e0; --cloud: #ffffff;
  --circle: #ee7a5f; --square: #2a9d8f; --triangle: #8e6bbf; --rect: #f2b33d;   /* ألوان الهوية الثابتة */
  --compass: #1f5f99; --compass-dk: #154674; --chaos: #c8392d;
  --good: #2e8a4e; --think: #9a5f08;
  --basket: #c98f55; --basket-dk: #9c6837;
  --dune1: #f0dfb8; --dune2: #e6cf9f; --sand-dk: #d8c08f; --sand-crack: #b99d6a;
  --stone: #a9a59b; --stone-dk: #7d7a72; --water: #3f9fd0; --water-hi: #a6e0f4;
  --palm: #4f9a4a; --palm-dry: #b8a26a; --trunk: #9c6837; --trunk-dk: #7a4f28;
  --top-a: #e9f1e4; --top-b: #dde9d6;
  --shadow: 0 5px 0 rgba(27, 52, 64, .10), 0 10px 22px rgba(27, 52, 64, .10);
  --f: "Baloo Bhaijaan 2", "Noto Naskh Arabic", "Noto Sans Arabic", "Geeza Pro", "Segoe UI", Tahoma, sans-serif;
  --tap: 56px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --sky-top: #183747; --sky-bot: #10232c; --ground: #2e2a1f; --paper: #1d313b; --ink: #ecf4f2; --muted: #a9c2c8; --line: #2d4a55; --cloud: #2a4552;
  --compass: #3d7cc0; --compass-dk: #2a5a8f; --chaos: #ff7a6a; --good: #63c98a; --think: #f0b45a;
  --dune1: #3a3424; --dune2: #2f2a1d; --sand-dk: #5d5137; --sand-crack: #7a6a48; --stone: #77746d; --stone-dk: #4b4944; --water: #2c7fae; --water-hi: #6cc3e6;
  --palm: #3f7f3c; --palm-dry: #7b6d47; --trunk: #7a5230; --trunk-dk: #5a3c22; --top-a: #1e3329; --top-b: #193027;
  --shadow: 0 5px 0 rgba(0,0,0,.25), 0 10px 22px rgba(0,0,0,.3); color-scheme: dark } }
:root[data-theme="dark"] {
  --sky-top: #183747; --sky-bot: #10232c; --ground: #2e2a1f; --paper: #1d313b; --ink: #ecf4f2; --muted: #a9c2c8; --line: #2d4a55; --cloud: #2a4552;
  --compass: #3d7cc0; --compass-dk: #2a5a8f; --chaos: #ff7a6a; --good: #63c98a; --think: #f0b45a;
  --dune1: #3a3424; --dune2: #2f2a1d; --sand-dk: #5d5137; --sand-crack: #7a6a48; --stone: #77746d; --stone-dk: #4b4944; --water: #2c7fae; --water-hi: #6cc3e6;
  --palm: #3f7f3c; --palm-dry: #7b6d47; --trunk: #7a5230; --trunk-dk: #5a3c22; --top-a: #1e3329; --top-b: #193027;
  --shadow: 0 5px 0 rgba(0,0,0,.25), 0 10px 22px rgba(0,0,0,.3); color-scheme: dark }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: linear-gradient(180deg, var(--sky-top), var(--sky-bot) 60%); background-color: var(--sky-bot); color: var(--ink);
  font-family: var(--f); font-size: 20px; line-height: 1.6; -webkit-tap-highlight-color: transparent; overflow: hidden; }
button { font-family: inherit; color: inherit; }
button:focus-visible, [tabindex]:focus-visible, summary:focus-visible { outline: 4px solid var(--compass); outline-offset: 3px; }
g[role="button"]:focus-visible { outline: none; filter: drop-shadow(0 0 6px var(--compass)); }
.screen { position: relative; z-index: 1; height: 100%; box-sizing: border-box; max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; }
.muted { color: var(--muted); }

/* أزرار بارزة كأزرار لعبة */
.go { min-height: 64px; border: 0; border-radius: 22px; background: var(--compass); color: #fff; font-size: 24px; font-weight: 800; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 6px 0 var(--compass-dk); transition: transform .08s, box-shadow .08s, opacity .2s; padding: 0 18px; }
.go:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--compass-dk); }
.go[disabled] { opacity: .35; cursor: default; transform: none; }
.go.idle { visibility: hidden; }                        /* الزرّ الكبير يُخفى حين لا فعل له (M2) */
.go svg { width: 28px; height: 28px; }
.go.big { min-height: 76px; min-width: 120px; } .go.big svg { width: 40px; height: 40px; }
.go.huge { width: 140px; height: 140px; border-radius: 50%; } .go.huge svg { width: 72px; height: 72px; }
.round { width: var(--tap); height: var(--tap); border-radius: 50%; border: 0; background: var(--paper); box-shadow: 0 4px 0 var(--line); display: grid; place-items: center; cursor: pointer; padding: 0; flex: none; overflow: hidden; }
.round svg, .round img { width: 100%; height: 100%; object-fit: cover; display: block; }
.round.ico svg { width: 26px; height: 26px; }
.round.digits { font-size: 16px; font-weight: 800; color: var(--compass); width: auto; min-width: var(--tap); padding: 0 10px; border-radius: 28px; }

/* ===== الخريطة ===== */
#home { display: grid; grid-template-rows: auto auto 1fr; gap: 10px; }
.hello { display: flex; align-items: center; gap: 8px; }
.hello b { font-size: 22px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.banner { border-radius: 26px; overflow: hidden; box-shadow: var(--shadow); background: var(--paper); }
.banner svg { width: 100%; height: auto; display: block; }
.banner h1 { margin: 0; padding: 4px 16px 10px; font-size: 30px; line-height: 1.3; text-wrap: balance; }
.banner p { margin: -6px 16px 12px; color: var(--muted); font-size: 16px; }
.path { display: grid; gap: 10px; align-content: start; overflow: auto; padding: 4px 2px 48px; min-height: 0; }
.stop { display: grid; grid-template-columns: 72px 1fr 34px; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 22px; border: 0; min-height: 76px;
  background: var(--paper); box-shadow: var(--shadow); cursor: pointer; text-align: right; font-size: 20px; font-weight: 800; }
.stop:nth-child(even) { margin-inline-start: 26px; } .stop:nth-child(odd) { margin-inline-end: 26px; }
.stop svg { width: 72px; height: 56px; }
.stop small { display: block; font-size: 14px; font-weight: 700; color: var(--muted); }
.stop .tag { font-style: normal; font-size: 12px; font-weight: 800; color: var(--think); border: 2px solid currentColor; border-radius: 99px; padding: 0 8px; margin-inline-start: 8px; vertical-align: middle; }
.stop[aria-disabled="true"] { opacity: .45; cursor: default; }
.stop.now { outline: 4px solid var(--compass); animation: glow 1.6s ease-in-out infinite; }
.stop.ws { background: color-mix(in srgb, var(--square) 14%, var(--paper)); }
.stop.ws.must { outline: 4px dashed var(--square); }
.stop.review { background: color-mix(in srgb, var(--rect) 22%, var(--paper)); }
@keyframes glow { 50% { outline-color: color-mix(in srgb, var(--compass) 35%, transparent); } }
.stop .st { width: 34px; height: 34px; }
.unithead { display: flex; align-items: center; gap: 10px; margin: 8px 4px 0; font-size: 19px; font-weight: 800; }
.unithead .ut { flex: 1; }
.unithead small { display: block; font-size: 13px; color: var(--muted); font-weight: 700; }
.unithead .ub, .unithead .st { width: 34px; height: 34px; flex: none; }
.unithead.locked { opacity: .5; }
.unithead .hosts { width: 96px; height: 44px; flex: none; }
.unithead .hosts svg { width: 100%; height: 100%; overflow: visible; }
.adult-link { position: fixed; left: max(12px, env(safe-area-inset-left, 0px)); bottom: calc(4px + env(safe-area-inset-bottom, 0px)); min-height: 44px; padding: 0 8px; font-size: 14px; color: var(--muted); background: none; border: 0; cursor: pointer; text-decoration: underline; z-index: 30; }

/* ===== الدرس ===== */
#lesson { display: grid; grid-template-rows: auto auto auto auto; align-content: center; gap: 12px; }
.top { display: flex; align-items: center; gap: 8px; }
.steps { flex: 1; display: grid; grid-template-columns: repeat(var(--n, 7), 1fr); gap: 6px; align-items: center; }
.steps i { height: 12px; border-radius: 12px; background: color-mix(in srgb, var(--paper) 70%, var(--line)); box-shadow: inset 0 2px 0 rgba(0,0,0,.06); transition: background .4s; }
.steps i.done { background: var(--square); } .steps i.now { background: var(--rect); }
.talk { display: grid; grid-template-columns: 84px 1fr; gap: 8px; align-items: end; min-height: 96px; }
.who { width: 84px; height: 96px; }
.who svg { width: 100%; height: 100%; overflow: visible; }
.speaking .who svg { animation: bob .45s ease-in-out infinite alternate; transform-origin: 50% 100%; }
@keyframes bob { to { transform: translateY(-5px) rotate(-3deg); } }
.blink { animation: blink 4.2s infinite; transform-box: fill-box; transform-origin: center; }
@keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
.bubble { position: relative; background: var(--paper); border-radius: 24px 24px 8px 24px; padding: 10px 16px 10px 66px; box-shadow: var(--shadow);   /* الذيل نحو المتكلم على اليمين (D232) */
  font-size: 21px; font-weight: 700; line-height: 1.75; min-height: 56px; display: flex; align-items: center; text-wrap: balance; margin-bottom: 8px; }
.bubble.chaos { color: var(--chaos); }
.bubble.hidetext #say { visibility: hidden; }            /* جملة فوضى الخاطئة تُسمع ولا تُكتب (D236) */
.bubble.hidetext::after { content: "؟"; position: absolute; inset-inline-start: 18px; font-size: 30px; font-weight: 800; color: var(--chaos); }
.replay { position: absolute; left: 4px; top: 50%; transform: translateY(-50%); width: var(--tap); height: var(--tap); border-radius: 50%; border: 0; background: var(--sky-bot); cursor: pointer; display: grid; place-items: center; }
.replay svg { width: 22px; height: 22px; }
.stage { position: relative; border-radius: 30px; box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; min-height: 0; background: var(--paper); }
/* إن ضاق الطول صغُر الرسم (meet) ليبقى صفّ الأزرار تحته لا فوقه */
.stage > svg { flex: 1 1 auto; min-height: 0; width: 100%; height: auto; max-height: 58vh; display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
.stage > .choices { flex: none; }
.bar { display: flex; gap: 10px; }
.bar .go { flex: 1; }
.help { width: 76px; min-height: 64px; border: 0; border-radius: 22px; background: var(--paper); box-shadow: 0 6px 0 var(--line); cursor: pointer; display: grid; place-items: center; padding: 4px; }
.help svg { width: 52px; height: 58px; }
.help.glow { animation: lantern 1.2s ease-in-out infinite alternate; }
@keyframes lantern { to { box-shadow: 0 6px 0 var(--line), 0 0 0 6px color-mix(in srgb, var(--rect) 55%, transparent), 0 0 26px var(--rect); } }
.pulse { animation: pulse 1.3s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .72; } }

/* السلال */
.bins { position: absolute; inset: auto 8px 8px 8px; display: grid; grid-template-columns: repeat(var(--n, 3), 1fr); gap: 6px; }
.bin { border: 0; background: none; padding: 0; cursor: pointer; display: grid; justify-items: center; font-size: 17px; font-weight: 800; color: var(--ink); min-height: 64px; }
.bin svg { width: 100%; max-width: 110px; height: auto; filter: drop-shadow(0 4px 0 rgba(0,0,0,.12)); transition: transform .15s; }
.bin.hot svg, .bin:active svg { transform: translateY(-4px) scale(1.04); }
.bin.ok svg { filter: drop-shadow(0 0 8px var(--good)); }
.bin.no { animation: shake .35s; }
.bin .lid { transition: transform .3s; transform-origin: 55px 30px; } .bin.shut .lid { transform: translateY(8px); }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.bins.shelf { background: color-mix(in srgb, var(--basket) 30%, transparent); border-radius: 16px; padding: 6px 4px 2px; }
.bins.shelf .bin svg { max-width: 92px; }

/* الخيارات المسموعة */
.choices { position: relative; display: grid; gap: 8px; padding: 0 10px 10px; }
.pick { border: 0; background: var(--sky-bot); box-shadow: 0 4px 0 var(--line); border-radius: 18px; padding: 10px 14px; font-size: 19px; font-weight: 700; text-align: right; cursor: pointer; min-height: 60px; color: var(--ink); }
.pick.reading { box-shadow: 0 0 0 3px var(--compass), 0 4px 0 var(--line); }
.pick.ok { box-shadow: 0 0 0 4px var(--good), 0 4px 0 var(--line); } .pick.no { box-shadow: 0 0 0 4px var(--think), 0 4px 0 var(--line); }
.pick[aria-pressed="true"] { box-shadow: 0 0 0 4px var(--compass), 0 4px 0 var(--line); }
.choices.icons { grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); }
.choices.icons .pick { display: grid; justify-items: center; align-content: center; gap: 2px; text-align: center; color: var(--compass); font-size: 18px; }
.choices.icons .pick span { color: var(--ink); }
.choices.icons.big .pick { min-height: 96px; font-size: 21px; }
.choices.cards { grid-template-columns: 1fr; }
.choices.cards .card { text-align: center; font-size: 20px; min-height: 64px; }
.choices.cards .card.hidden-text .q { font-size: 30px; font-weight: 800; color: var(--chaos); }
.choices.cards .sent { font-size: 28px; font-weight: 800; letter-spacing: .04em; unicode-bidi: isolate; }
.choices.nums { grid-template-columns: repeat(3, 1fr); }
.choices.nums .num { display: grid; justify-items: center; text-align: center; min-height: 72px; }
.choices.nums .num b { font-size: 30px; line-height: 1.1; color: var(--compass); }
.choices.nums .num span { font-size: 17px; }
.choices.faces .pick svg { width: 48px; height: 48px; }
.choices.donebar { grid-template-columns: minmax(0, 220px); justify-content: center; }
.pick.done { display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--good); font-size: 21px; font-weight: 800; }
.pick.done svg { width: 30px; height: 30px; } .pick.done span { color: var(--ink); }
.choices.build { grid-template-columns: repeat(3, 1fr); }
.pick.pot svg { filter: drop-shadow(0 3px 0 rgba(0,0,0,.15)); }
.wsbar { position: absolute; top: 8px; inset-inline-start: 8px; display: flex; gap: 6px; padding: 0; }
.wsbar .pick { min-height: var(--tap); padding: 4px 12px; font-size: 16px; grid-auto-flow: column; gap: 6px; }
.wssel { filter: drop-shadow(0 0 6px var(--compass)) drop-shadow(0 0 2px var(--compass)); }

/* ===== الأغطية ===== */
.cover { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; overflow: auto; text-align: center; background: linear-gradient(180deg, var(--sky-top), var(--sky-bot)); background-color: var(--sky-bot);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px; }
.cover .talk { grid-template-columns: 80px 1fr; min-height: 0; text-align: right; width: 100%; }
.cover .talk .who { width: 80px; height: 92px; }
.cover .bubble { padding: 10px 16px; }
.startbox { display: grid; justify-items: center; gap: 22px; }
.who.big { width: 150px; height: 168px; }
.breakbox { display: grid; gap: 14px; width: min(440px, 100%); justify-items: center; }
.breakbox p.big { font-size: 22px; font-weight: 700; margin: 0; text-wrap: balance; }
.breakbox .go { width: 100%; }
.breakbox .choices { width: 100%; padding: 0; }
.breakbox .restart { width: 100%; height: auto; border-radius: 22px; box-shadow: var(--shadow); }
.more { background: none; border: 0; color: var(--muted); font-size: 15px; text-decoration: underline; cursor: pointer; min-height: 44px; }
.profile { display: grid; gap: 14px; width: min(460px, 100%); }
.avatars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.av { border: 0; border-radius: 22px; background: var(--paper); box-shadow: 0 6px 0 var(--line); padding: 6px; cursor: pointer; aspect-ratio: 1; min-height: 72px; }
.av svg { width: 100%; height: 100%; }
.av[aria-pressed="true"] { box-shadow: 0 0 0 5px var(--compass), 0 6px 0 var(--compass-dk); }
details.adult { background: var(--paper); border-radius: 18px; padding: 8px 12px; text-align: right; font-size: 15px; }
details.adult summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; color: var(--muted); font-weight: 700; }
details.adult input[type=text] { font: inherit; font-size: 22px; font-weight: 700; text-align: center; padding: 8px 12px; border-radius: 16px; border: 3px solid var(--line); background: var(--sky-bot); color: var(--ink); width: 100%; box-sizing: border-box; margin: 6px 0; }
details.adult input[type=text]:focus { outline: none; border-color: var(--compass); }
.photo-row { display: flex; align-items: center; justify-content: center; gap: 12px; }
.photo-row .round { width: 64px; height: 64px; }
.photo-row .pick { min-height: 48px; font-size: 16px; }
.kids { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; width: 100%; }
.kid { border: 0; border-radius: 22px; background: var(--paper); box-shadow: 0 6px 0 var(--line); padding: 12px 8px; display: grid; justify-items: center; gap: 6px; font-size: 21px; font-weight: 800; cursor: pointer; min-height: 120px; }
.kid .round { width: 84px; height: 84px; }
.kid[aria-pressed="true"] { box-shadow: 0 0 0 4px var(--compass), 0 6px 0 var(--compass-dk); }
.gallery { width: min(560px, 100%); display: grid; gap: 12px; align-self: start; text-align: right; }
.gallery .ghead { display: flex; align-items: center; gap: 10px; font-size: 24px; }
.huntgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.gitems { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.gitems figure { margin: 0; background: var(--paper); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; text-align: center; font-weight: 700; font-size: 16px; }
.gitems img, .gitems svg { width: 100%; height: 120px; object-fit: cover; display: block; }
.digits .pairs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; }
.digits .pair { display: flex; justify-content: center; align-items: center; gap: 8px; background: var(--paper); border-radius: 16px; padding: 6px; box-shadow: 0 4px 0 var(--line); font-size: 28px; }
.digits .pair.on { box-shadow: 0 0 0 4px var(--compass), 0 4px 0 var(--line); }
.digits .pair .e, .digits .pair .w { font-weight: 800; } .digits .pair span { color: var(--muted); font-size: 20px; }
.digits .dmatch { display: grid; gap: 12px; justify-items: center; width: 100%; }
.digits .dmatch .ask { font-size: 64px; line-height: 1.1; font-weight: 800; }
.digits .dmatch .opts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; }
.digits .dmatch .pick { text-align: center; font-size: 36px; font-weight: 800; color: var(--compass); }

/* ===== لوحة الكبار ===== */
.panel { position: fixed; inset: 0; z-index: 40; background: var(--sky-bot); overflow: auto; font-size: 16px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px; }
.panel .wrap { max-width: 640px; margin: 0 auto; display: grid; gap: 14px; }
.panel h2 { margin: 0; font-size: 24px; }
.panel p { margin: 6px 0; }
.panel .card { background: var(--paper); border-radius: 18px; padding: 12px 14px; box-shadow: var(--shadow); min-width: 0; overflow-x: auto; }
.panel .card.warn { border: 2px solid var(--think); }
.panel details.card summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.panel table { border-collapse: collapse; width: 100%; font-size: 14px; }
.panel td, .panel th { border-bottom: 1px solid var(--line); padding: 6px 4px; text-align: right; vertical-align: top; }
.panel tr.uh td { font-weight: 800; padding-top: 12px; }
.panel .row { display: flex; gap: 10px; flex-wrap: wrap; } .panel .row .go { flex: 1; min-width: 140px; }
.panel .aq { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding: 4px 0; }
.panel input[type=file] { min-height: 44px; width: 100%; padding: 8px 0; box-sizing: border-box; font-family: inherit; }   /* هدف لمس 44 للكبار (المبدأ 13) */
.panel .errlog { font-size: 12px; white-space: pre-wrap; background: var(--sky-bot); padding: 8px; border-radius: 10px; text-align: left; }
.gate { max-width: 420px !important; text-align: center; }
.gate .gq { font-size: 34px; font-weight: 800; margin: 0; }
.gate form { display: grid; gap: 10px; }
.gate input { font: inherit; font-size: 28px; font-weight: 800; text-align: center; width: 100%; box-sizing: border-box; padding: 8px 12px; border-radius: 16px; border: 3px solid var(--line); background: var(--paper); color: var(--ink); }
.gate input:focus { outline: none; border-color: var(--compass); }
.gate .msg { color: var(--think); min-height: 1.6em; }
.seg { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; align-items: center; }
.seg .pick { min-height: 48px; padding: 6px 14px; font-size: 16px; }
.talkcard { border-inline-start: 4px solid var(--square); padding-inline-start: 10px; margin: 8px 0; }
.pill { display: inline-block; padding: 1px 10px; border-radius: 99px; font-size: 13px; font-weight: 700; background: var(--sky-bot); }
.pill.good { color: var(--good); } .pill.think { color: var(--think); }
@media print { body { overflow: visible !important; background: #fff !important; } body > *:not(#panel) { display: none !important; }
  #panel { position: static !important; overflow: visible !important; background: #fff !important; } .noprint { display: none !important; } .panel .card { box-shadow: none; border: 1px solid #ccc; } }

/* احتفال: قصاصات من الأشكال نفسها */
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 50; overflow: hidden; }
.confetti i { position: absolute; top: -30px; width: 16px; height: 16px; animation: fall 1.7s cubic-bezier(.3,.6,.5,1) forwards; }
@keyframes fall { to { transform: translate(var(--dx), 110vh) rotate(var(--r)); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } .confetti { display: none; } }
@media (max-height: 660px) { .bubble { font-size: 18px; } .talk { min-height: 80px; } .who { height: 80px; } .go { min-height: 56px; } .stage > svg { max-height: 52vh; } }

ask":"كَمْ يُسَاوِي؟","gen.fact.fingers":"نَعُدُّ الأَصَابِعَ مَعًا.","gen.story.add":"{أَضِفِ|أَضِيفِي} المُكَعَّبَاتِ كَمَا فِي القِصَّةِ، ثُمَّ {اِلْمَسْ|اِلْمَسِي} «تَمَّ».","gen.story.remove":"{أَبْعِدِ|أَبْعِدِي} المُكَعَّبَاتِ كَمَا فِي القِصَّةِ، ثُمَّ {اِلْمَسْ|اِلْمَسِي} «تَمَّ».","gen.story.ask":"كَمْ مَعَنَا الآنَ؟","gen.story.hintAdd":"فِي القِصَّةِ جَاءَتْ أَشْيَاءُ أُخْرَى: نَضُمُّهَا.","gen.story.hintRemove":"فِي القِصَّةِ ذَهَبَتْ أَشْيَاءُ: نُبْعِدُهَا.","gen.story.s01":"فِي السَّلَّةِ ثَلَاثُ تَمَرَاتٍ، ثُمَّ جَاءَتْ تَمْرَتَانِ.","gen.story.s02":"عَلَى النَّخْلَةِ سِتَّةُ عَصَافِيرَ، ثُمَّ طَارَ اثْنَانِ.","gen.story.s03":"فِي البِرْكَةِ أَرْبَعُ بَطَّاتٍ، ثُمَّ جَاءَتْ ثَلَاثٌ.","gen.story.s04":"مَعَ فَوْضَى خَمْسُ تَمَرَاتٍ، أَكَلَتْ وَاحِدَةً.","gen.story.s05":"فِي الحَدِيقَةِ خَمْسُ وَرْدَاتٍ، ثُمَّ زَرَعْنَا وَرْدَتَيْنِ.","gen.story.s06":"فِي البُرْجِ سَبْعَةُ مُكَعَّبَاتٍ، ثُمَّ أَخَذَتْ فَوْضَى ثَلَاثَةً.","gen.vertices.ask":"{اِلْمَسْ|اِلْمَسِي} رُؤُوسَ هَذَا الشَّكْلِ، رَأْسًا رَأْسًا.","gen.vertices.together":"الرُّؤُوسُ فِي الدَّوَائِرِ المُنَقَّطَةِ. {اِلْمَسْهَا|اِلْمَسِيهَا} كُلَّهَا.","gen.connect.ask":"{صِلِ|صِلِي} النِّقَاطَ الثَّلَاثَ {بِإِصْبَعِكَ|بِإِصْبَعِكِ}، حَتَّى يَنْغَلِقَ الشَّكْلُ.","gen.connect.together":"وَصَلْتُ ضِلْعَيْنِ. {أَغْلِقِ|أَغْلِقِي} الشَّكْلَ بِالضِّلْعِ الثَّالِثِ.","gen.connect.reveal":"ثَلَاثَةُ أَضْلَاعٍ مُسْتَقِيمَةٍ تَنْغَلِقُ: مُثَلَّثٌ.","gen.rect.ask":"أَيُّ نُقْطَةٍ تُكْمِلُ المُسْتَطِيلَ؟ {اِلْمَسْهَا|اِلْمَسِيهَا}.","gen.rect.together":"كُلُّ رُكْنٍ فِي المُسْتَطِيلِ مِثْلُ رُكْنِ الوَرَقَةِ. أَيُّ نُقْطَةٍ تَصْنَعُ رُكْنًا كَهَذَا؟","gen.rect.reveal":"هَذِهِ النُّقْطَةُ تَصْنَعُ أَرْبَعَةَ أَرْكَانٍ مِثْلَ رُكْنِ الوَرَقَةِ.","gen.prop.ask":"إِذَا دَفَعْنَاهُ، هَلْ يَتَدَحْرَجُ، أَمْ يَقِفُ؟","gen.prop.together":"{شَاهِدِ|شَاهِدِي} التَّجْرِبَةَ مَرَّةً أُخْرَى، ثُمَّ {اِخْتَرْ|اِخْتَارِي}.","gen.prop.rolls":"يَتَدَحْرَجُ عَلَى سَطْحِهِ المُنْحَنِي.","gen.prop.stays":"يَقِفُ عَلَى وَجْهٍ مُسَطَّحٍ.","gen.face.ask":"{اِلْمَسِ|اِلْمَسِي} الوَجْهَ المُسَطَّحَ.","gen.face.together":"الوَجْهُ المُسَطَّحُ حَوْلَهُ خَطٌّ مُنَقَّطٌ. {اِلْمَسْهُ|اِلْمَسِيهِ}.","gen.face.reveal":"هَذَا هُوَ الوَجْهُ المُسَطَّحُ: نَلْمَسُهُ بِكَفِّنَا.","gen.stamp.ask":"إِذَا خَتَمْنَا بِوَجْهِهِ، مَا شَكْلُ البَصْمَةِ؟","gen.stamp.together":"{شَاهِدِ|شَاهِدِي} الخَتْمَ مَرَّةً أُخْرَى، ثُمَّ {اِخْتَرْ|اِخْتَارِي}.","gen.stamp.reveal":"هَذِهِ بَصْمَةُ وَجْهِهِ المُسَطَّحِ.","gen.pickAll.together":"اِخْتَرْتُ بَعْضَهَا {مَعَكَ|مَعَكِ}. بَقِيَ وَاحِدٌ: {اِبْحَثْ|اِبْحَثِي} عَنْهُ، ثُمَّ «تَمَّ».","gen.paint.pot":"{اِخْتَرْ|اِخْتَارِي} لَوْنًا أَوَّلًا.","gen.paint.together":"لَوَّنْتُ {مَعَكَ|مَعَكِ}، وَبَقِيَ شَكْلٌ وَاحِدٌ.","gen.arch.no":"لَيْسَ هَذَا. {اُنْظُرْ|اُنْظُرِي} إِلَى شَكْلِهِ جَيِّدًا.","gen.feel.again":"{اِسْمَعِ|اِسْمَعِي} الوَصْفَ مَرَّةً أُخْرَى، وَ{فَكِّرْ|فَكِّرِي}.","gen.house.pick":"{اِخْتَرْ|اِخْتَارِي} قِطْعَةً أَوَّلًا.","gen.house.slot.square":"لِنُفَكِّرْ مَعًا: هَذَا المَكَانُ يَحْتَاجُ قِطْعَةً لَهَا أَرْبَعَةُ أَضْلَاعٍ مُتَسَاوِيَةٍ.","gen.house.slot.triangle":"لِنُفَكِّرْ مَعًا: هَذَا المَكَانُ يَحْتَاجُ قِطْعَةً لَهَا ثَلَاثَةُ أَضْلَاعٍ.","gen.house.slot.circle":"لِنُفَكِّرْ مَعًا: هَذَا المَكَانُ يَحْتَاجُ قِطْعَةً حَافَّتُهَا مُنْحَنِيَةٌ بِلَا رُؤُوسٍ.","gen.hunt.look":"{اُنْظُرْ|اُنْظُرِي} إِلَى حَوَافِّهِ وَرُؤُوسِهِ، لَا إِلَى لَوْنِهِ.","gen.hunt.rotated":"هُوَ مَائِلٌ فَقَطْ. {عُدَّ|عُدِّي} رُؤُوسَهُ، وَ{قَارِنْ|قَارِنِي} أَضْلَاعَهُ.","gen.faces.already":"هَذَا الوَجْهُ عَلَيْهِ قُصَاصَةٌ. {اِبْحَثْ|اِبْحَثِي} عَنْ وَجْهٍ آخَرَ.","gen.faces.turn":"{أَدِرْهُ|أَدِيرِيهِ} بِزِرِّ التَّدْوِيرِ {لِتَرَى|لِتَرَيْ} وُجُوهًا أُخْرَى.","gen.robot.count.circle":"كَمْ دَائِرَةً فِي {رُوبُوتِكَ|رُوبُوتِكِ}؟ {اِلْمَسْهَا|اِلْمَسِيهَا} وَ{عُدَّ|عُدِّي}.","gen.robot.count.square":"كَمْ مُرَبَّعًا فِي {رُوبُوتِكَ|رُوبُوتِكِ}؟ {اِلْمَسْهَا|اِلْمَسِيهَا} وَ{عُدَّ|عُدِّي}.","gen.robot.count.triangle":"كَمْ مُثَلَّثًا فِي {رُوبُوتِكَ|رُوبُوتِكِ}؟ {اِلْمَسْهَا|اِلْمَسِيهَا} وَ{عُدَّ|عُدِّي}.","gen.robot.count.rect":"كَمْ مُسْتَطِيلًا فِي {رُوبُوتِكَ|رُوبُوتِكِ}؟ {اِلْمَسْهَا|اِلْمَسِيهَا} وَ{عُدَّ|عُدِّي}.","gen.bag.mat":"رَائِعٌ! {أَبْقِ|أَبْقِي} الأَشْيَاءَ قَرِيبَةً، سَنَلْمَسُهَا فِي الدَّرْسِ.","gen.bag.screen":"لَا بَأْسَ، نَلْعَبُ عَلَى الشَّاشَةِ. وَحِينَ تَحْضُرُ الأَشْيَاءُ نُجَرِّبُهَا بِأَيْدِينَا.","gen.choice.ask":"{مَاذَا تَخْتَارُ|مَاذَا تَخْتَارِينَ}؟ تَمْرِينٌ عَادِيٌّ، أَمْ تَحَدٍّ بِأَشْيَاءَ أَصْعَبَ؟","gen.practice.intro":"هَيَّا نَتَمَرَّنُ.","gen.ms.intro":"الآنَ أَسْئِلَةٌ بِلَا مُسَاعَدَةٍ. {خُذْ وَقْتَكَ|خُذِي وَقْتَكِ}.","gen.ms.again":"لِنَعُدْ إِلَى الفِكْرَةِ مَعًا، ثُمَّ نُحَاوِلُ مَرَّةً أُخْرَى.","gen.ms.round2":"وَالآنَ {جَرِّبْ|جَرِّبِي} مَرَّةً أُخْرَى، بِلَا مُسَاعَدَةٍ.","gen.ms.later":"{أَحْسَنْتَ|أَحْسَنْتِ} المُحَاوَلَةَ! سَنَعُودُ إِلَى هَذِهِ الفِكْرَةِ فِي مُرَاجَعَةِ اليَوْمِ. هَيَّا نُكْمِلُ.","gen.ms.ok":"رَائِعٌ! {أَتْقَنْتَ|أَتْقَنْتِ} أَفْكَارَ هَذَا الدَّرْسِ. {هَذِهِ نَجْمَتُكَ|هَذِهِ نَجْمَتُكِ}.","gen.chaos.find":"فَوْضَى وَضَعَتْ شَيْئًا فِي غَيْرِ مَكَانِهِ. {اِبْحَثْ|اِبْحَثِي} عَنْهُ، وَ{اِلْمَسْهُ|اِلْمَسِيهِ}.","gen.chaos.no":"هَذَا فِي مَكَانِهِ. {اِبْحَثْ|اِبْحَثِي} عَنْ غَيْرِهِ.","gen.chaos.found":"{وَجَدْتَهُ|وَجَدْتِهِ}! هَيَّا نَتَحَقَّقُ بِأَيْدِينَا.","gen.chaos.countFirst":"نُقَابِلُ وَنَعُدُّ أَوَّلًا، ثُمَّ نَحْكُمُ.","gen.chaos.whichCard":"أَيُّ بِطَاقَةٍ لَهُ؟ {اِلْمَسْهَا|اِلْمَسِيهَا}.","gen.chaos.cards":"وَالآنَ جُمْلَتَانِ. {اِسْمَعْهُمَا|اِسْمَعِيهِمَا}، ثُمَّ {اِخْتَرِ|اِخْتَارِي} الصَّحِيحَةَ.","gen.chaos.thinks":"فَوْضَى تَظُنُّ…","gen.chaos.listenAgain":"لِنَسْمَعْهُمَا مَرَّةً أُخْرَى.","gen.chaos.together":"الصَّحِيحَةُ هِيَ الَّتِي تَحَقَّقْنَا مِنْهَا بِأَيْدِينَا. {اِسْمَعْهُمَا|اِسْمَعِيهِمَا} مَرَّةً أُخْرَى.","gen.chaos.right":"نَعَمْ! هَذِهِ هِيَ الجُمْلَةُ الصَّحِيحَةُ:","gen.faces.ask":"كَيْفَ كَانَ الدَّرْسُ؟ سَهْلًا، أَمْ مُنَاسِبًا، أَمْ صَعْبًا؟","gen.faces.easy":"شُكْرًا! فِي المَرَّةِ القَادِمَةِ {تَسْتَطِيعُ|تَسْتَطِيعِينَ} أَنْ {تَخْتَارَ|تَخْتَارِي} التَّحَدِّي.","gen.faces.ok":"شُكْرًا! هَذَا جَمِيلٌ.","gen.faces.hard":"{شُكْرًا لِأَنَّكَ أَخْبَرْتَنِي|شُكْرًا لِأَنَّكِ أَخْبَرْتِنِي}. الصَّعْبُ يَصِيرُ سَهْلًا بِالمُحَاوَلَةِ، وَسَنُرَاجِعُهُ مَعًا.","gen.test.intro":"الآنَ أَسْئِلَةُ الوَاحَةِ. {اِسْمَعِ|اِسْمَعِي} السُّؤَالَ، ثُمَّ {أَجِبْ|أَجِيبِي}. لَا مُسَاعَدَةَ هَذِهِ المَرَّةَ.","gen.test.again":"قَرِيبٌ! نُرَاجِعُ دَرْسًا وَاحِدًا مَعًا، ثُمَّ نَعُودُ إِلَى أَسْئِلَةِ الوَاحَةِ.","gen.test.remedial":"وَقَبْلَ أَنْ نَعُودَ: {جَرِّبْ|جَرِّبِي} مَعَ الكِبَارِ بِأَشْيَاءَ حَقِيقِيَّةٍ مِنَ البَيْتِ.","gen.review.intro":"مُرَاجَعَةٌ قَصِيرَةٌ! أَسْئِلَةٌ مِنْ دُرُوسٍ {دَرَسْتَهَا|دَرَسْتِهَا} قَبْلَ أَيَّامٍ.","gen.review.done":"{أَحْسَنْتَ|أَحْسَنْتِ}! {تَذَكَّرْتَ|تَذَكَّرْتِ} كُلَّ شَيْءٍ. هَذِهِ نَجْمَةُ المُرَاجَعَةِ.","gen.review.later":"جَيِّدٌ! مَا {أَخْطَأْتَ|أَخْطَأْتِ} فِيهِ نُرَاجِعُهُ قَرِيبًا مَرَّةً أُخْرَى.","gen.stream.glance.model":"لُعْبَةٌ جَدِيدَةٌ: تَظْهَرُ نِقَاطٌ لَحْظَةً ثُمَّ تَخْتَفِي. {اُنْظُرْ|اُنْظُرِي} كَيْفَ أَعْرِفُ عَدَدَهَا دُونَ أَنْ أَعُدَّ.","gen.stream.glance.model2":"رَأَيْتُ ثَلَاثَ نِقَاطٍ عَلَى خَطٍّ مَائِلٍ: ثَلَاثَة! وَالآنَ {دَوْرُكَ|دَوْرُكِ}.","gen.stream.fluency.model":"«أَصَابِعِي الخَمْسُ»: إِصْبَعَانِ هُنَا، وَإِصْبَعٌ هُنَا. كَمْ مَعًا؟","gen.stream.story.model":"قِصَّةٌ مِنَ الوَاحَةِ: فِي السَّلَّةِ ثَلَاثُ تَمَرَاتٍ، ثُمَّ جَاءَتْ تَمْرَتَانِ. أُمَثِّلُهَا بِالمُكَعَّبَاتِ.","gen.stream.story.model2":"صَارَتْ خَمْسَ تَمَرَاتٍ. وَالآنَ {تَحُلُّ أَنْتَ|تَحُلِّينَ أَنْتِ} القِصَصَ.","gen.session.break":"عَمَلٌ رَائِعٌ! حَانَ وَقْتُ الاسْتِرَاحَةِ: {اِشْرَبْ|اِشْرَبِي} مَاءً، وَ{تَحَرَّكْ|تَحَرَّكِي} قَلِيلًا، ثُمَّ نَعُودُ.","gen.exit.ask":"هَلْ نَخْرُجُ إِلَى الخَرِيطَةِ؟ سَأَحْفَظُ مَكَانَنَا.","gen.resume.ask":"نُكْمِلُ مِنْ حَيْثُ تَوَقَّفْنَا، أَمْ نَبْدَأُ الدَّرْسَ مِنْ أَوَّلِهِ؟","gen.crash":"حَدَثَ خَلَلٌ صَغِيرٌ. نَعُودُ إِلَى الخَرِيطَةِ، وَنُكْمِلُ مِنْ هُنَاكَ.","gen.first.hello":"أَهْلًا وَسَهْلًا فِي وَا بُ عَلَى الشَّاشَةِ؟","hook.01":["chaos","هِيهِي! صَنَعْتُ عَرَبَتَيْنِ، وَسَأَدْفَعُهُمَا مَعًا!"],"hook.02":"أَيُّ عَرَبَةٍ سَتَسِيرُ بِسُهُولَةٍ؟ {تَوَقَّعْ|تَوَقَّعِي}، ثُمَّ {اِلْمَسْهَا|اِلْمَسِيهَا}.","hook.03a":"تَوَقُّعٌ جَمِيلٌ! هَيَّا نُشَاهِدُ.","hook.03b":"هَيَّا نُشَاهِدُ مَا يَحْدُثُ.","hook.04":"العَرَبَةُ ذَاتُ العَجَلَاتِ الدَّائِرِيَّةِ سَارَتْ بِسُهُولَةٍ، وَالأُخْرَى تَعَثَّرَتْ.","hook.05":["chaos","أُوه! لِمَاذَا تَتَعَثَّرُ عَرَبَتِي؟"],"hook.06":"هَذَا مَا سَنَكْتَشِفُهُ الآنَ بِأَصَابِعِنَا.","mat.01":"{أَمْسِكِ|أَمْسِكِي} الطَّبَقَ، وَ{مَرِّرْ|مَرِّرِي} {إِصْبَعَكَ|إِصْبَعَكِ} عَلَى حَافَّتِهِ دَوْرَةً كَامِلَةً، ثُمَّ عَلَى حَافَّةِ البَلَاطَةِ. وَحِينَ {تَنْتَهِي|تَنْتَهِينَ}، {اِلْمَسْ|اِلْمَسِي} «تَمَّ».","mat.02":"أَيْنَ تَوَقَّفَ {إِصْبَعُكَ|إِصْبَعُكِ}؟ هَيَّا نَرَى عَلَى الشَّاشَةِ أَيْضًا.","exp.01":"{مَرِّرْ إِصْبَعَكَ|مَرِّرِي إِصْبَعَكِ} عَلَى حَافَّةِ كُلِّ شَكْلٍ، دَوْرَةً كَامِلَةً. أَيْنَ يَتَوَقَّفُ الإِصْبَعُ؟","exp.03":"عَلَى الدَّائِرَةِ مَرَّ الإِصْبَعُ بِسُهُولَةٍ: حَافَّتُهَا مُنْحَنِيَةٌ، وَلَا رُؤُوسَ لَهَا.","exp.04":"وَعَلَى المُرَبَّعِ تَوَقَّفَ أَرْبَعَ مَرَّاتٍ. النُّقْطَةُ الَّتِي يَتَوَقَّفُ عِنْدَهَا الإِصْبَعُ اسْمُهَا: رَأْسٌ. لِلْمُرَبَّعِ أَرْبَعَةُ رُؤُوسٍ، وَحَوَافُّهُ مُسْتَقِيمَةٌ.","exp.05":["chaos","آه! لِذَلِكَ تَعَثَّرَتْ عَرَبَتِي عِنْدَ الرُّؤُوسِ!"],"wk.01":"هَذَا مُرَبَّعٌ. نَعُدُّ رُؤُوسَهُ، وَنَبْدَأُ مِنَ الرَّأْسِ الأَعْلَى عَلَى اليَمِينِ.","wk.02":"أَرْبَعَةُ رُؤُوسٍ، وَحَوَافُّهُ مُسْتَقِيمَةٌ.","wk.03":"هَلْ مَا زَالَ مُرَبَّعًا؟ هَيَّا نَعُدُّ: {اِلْمَسْ|اِلْمَسِي} كُلَّ رَأْسٍ.","wk.05":"مَا زَالَ لَهُ أَرْبَعَةُ رُؤُوسٍ، وَحَوَافُّهُ مُسْتَقِيمَةٌ. فَهُوَ مَا زَالَ مُرَبَّعًا!","wk.06":"وَالمُرَبَّعُ يَكُونُ صَغِيرًا أَوْ كَبِيرًا، مَائِلًا أَوْ مُسْتَقِيمًا، وَبِأَيِّ لَوْنٍ.","wk.07":"وَالدَّائِرَةُ؟ حَافَّتُهَا مُنْحَنِيَةٌ كُلُّهَا، وَلَا رُؤُوسَ لَهَا، مَهْمَا أَدَرْنَاهَا.","pr.intro":"إِلَى أَيِّ سَلَّةٍ يَذْهَبُ كُلُّ شَكْلٍ؟ سَلَّةُ الدَّوَائِرِ، وَسَلَّةُ المُرَبَّعَاتِ، وَسَلَّةُ «غَيْرُ ذَلِكَ». {اِلْمَسِ|اِلْمَسِي} السَّلَّةَ، {أَوِ اسْحَبِ|أَوِ اسْحَبِي} الشَّكْلَ إِلَيْهَا.","pr.paint":"{لَوِّنِ|لَوِّنِي} الدَّوَائِرَ بِالمَرْجَانِيِّ، وَالمُرَبَّعَاتِ بِالأَخْضَرِ المُزْرَقِّ: {اِخْتَرِ|اِخْتَارِي} اللَّوْنَ، ثُمَّ {اِلْمَسِ|اِلْمَسِي} الشَّكْلَ.","pr.which":"أَيُّ هَذِهِ الأَشْيَاءِ دَوَائِرُ؟ {اِلْمَسْهَا|اِلْمَسِيهَا} كُلَّهَا، ثُمَّ {اِلْمَسْ|اِلْمَسِي} «تَمَّ».","pr.odd":"ثَلَاثَةٌ مِنْ هَذِهِ دَوَائِرُ، وَوَاحِدٌ مُخْتَلِفٌ. {اِلْمَسِ|اِلْمَسِي} المُخْتَلِفَ.","game.01":"لُعْبَةُ سَلَّةِ الأَشْكَالِ: سَلَّتَانِ فَقَطْ، لِلدَّوَائِرِ وَلِلْمُرَبَّعَاتِ. {خُذْ وَقْتَكَ|خُذِي وَقْتَكِ}.","why.sqRot":"أَرْبَعَةُ رُؤُوسٍ وَحَوَافُّ مُسْتَقِيمَةٌ، حَتَّى وَهُوَ مَائِلٌ.","why.sq":"أَرْبَعَةُ رُؤُوسٍ وَحَوَافُّ مُسْتَقِيمَةٌ.","why.c":"حَافَّتُهُ مُنْحَنِيَةٌ، وَلَا رُؤُوسَ لَهُ.","why.oval":"مَمْطُوطٌ: طَوِيلٌ مِنْ جِهَةٍ وَقَصِيرٌ مِنْ جِهَةٍ، فَلَيْسَ دَائِرَةً.","why.other":"لَيْسَ دَائِرَةً وَلَا مُرَبَّعًا.","ch.after":"مَا زَالَ لَهُ أَرْبَعَةُ رُؤُوسٍ. مَكَانُهُ سَلَّةُ المُرَبَّعَاتِ.","ch.right":"المُرَبَّعُ المَائِلُ مَا زَالَ مُرَبَّعًا: لَهُ أَرْبَعَةُ رُؤُوسٍ.","ch.wrong":["chaos","إِذَا مَالَ صَارَ شَكْلًا آخَرَ."],"ms.recall":"المُرَبَّعُ المَائِلُ مَا زَالَ مُرَبَّعًا: أَرْبَعَةُ رُؤُوسٍ. وَالدَّائِرَةُ حَافَّتُهَا مُنْحَنِيَةٌ، بِلَا رُؤُوسٍ.","ms.ok":"رَائِعٌ! {أَتْقَنْتَ|أَتْقَنْتِ} الدَّائِرَةَ وَالمُرَبَّعَ. {هَذِهِ نَجْمَتُكَ|هَذِهِ نَجْمَتُكِ}.","wrap.01":"صَارَ فِي الوَاحَةِ نَبْعٌ دَائِرِيٌّ، وَبَلَاطٌ مُرَبَّعٌ حَوْلَهُ!","wrap.home":["chaos","مُهِمَّةُ البَيْتِ: {اِبْحَثْ|اِبْحَثِي} مَعَ الكِبَارِ عَنْ شَيْءٍ دَائِرِيٍّ وَشَيْءٍ مُرَبَّعٍ، وَ{مَرِّرْ|مَرِّرِي} {إِصْبَعَكَ|إِصْبَعَكِ} عَلَى حَافَّتَيْهِمَا."]},"flow":[{"s":"hook","scene":"cartsRace","lines":["hook.01","hook.02","hook.03a","hook.03b","hook.04","hook.05","hook.06"]},{"s":"explore","scene":"trace","mat":{"prompt":"mat.01","show":["plate","tile"],"after":"mat.02"},"shapes":[{"type":"circle","kind":"circle","size":124,"color":"$id.circle"  أَضْلَاعٍ مُسْتَقِيمَةٍ، وَثَلَاثَةُ رُؤُوسٍ. وَلِلْمُرَبَّعِ أَرْبَعَةُ أَضْلَاعٍ، وَأَرْبَعَةُ رُؤُوسٍ.","n.01":"كَمْ رَأْسًا لِلْمُرَبَّعِ؟ {اُنْظُرْ|اُنْظُرِي} كَيْفَ أَعُدُّ: أَلْمَسُ كُلَّ رَأْسٍ مَرَّةً وَاحِدَةً.","n.02":"آخِرُ عَدَدٍ قُلْتُهُ هُوَ عَدَدُ الرُّؤُوسِ: أَرْبَعَة.","n.03":"وَالآنَ {عُدَّ أَنْتَ|عُدِّي أَنْتِ}: {اِلْمَسْ|اِلْمَسِي} كُلَّ رَأْسٍ مَرَّةً وَاحِدَةً.","n.04":"فَوْضَى عَدَّتْ رُؤُوسَ المُرَبَّعِ، فَظَهَرَ عَلَى عَدَّادِهَا هَذَا العَدَدُ. أَيُّ رَأْسٍ عَدَّتْهُ مَرَّتَيْنِ؟ {اِلْمَسْهُ|اِلْمَسِيهِ}.","n.05":"{اُنْظُرْ|اُنْظُرِي} إِلَى الشَّارَاتِ: أَيُّ رَأْسٍ عَلَيْهِ شَارَتَانِ؟","n.06":"{وَجَدْتَهُ|وَجَدْتِهِ}! نَعُدُّ مِنْ جَدِيدٍ، رَأْسًا رَأْسًا: {اِلْمَسْ|اِلْمَسِي} كُلَّ رَأْسٍ مَرَّةً.","n.07":"أَرْبَعَة! لِكُلِّ رَأْسٍ عَدَدٌ وَاحِدٌ.","n.08":"وَالأَشْيَاءُ نَعُدُّهَا هَكَذَا أَيْضًا: نَلْمَسُ كُلَّ وَاحِدٍ مَرَّةً، وَآخِرُ عَدَدٍ هُوَ «كَمْ».","wk.01":"هَذَا مُثَلَّثٌ: نَعُدُّ أَضْلَاعَهُ.","wk.02":"ثَلَاثَةُ أَضْلَاعٍ، وَثَلَاثَةُ رُؤُوسٍ.","wk.03":"هَلْ مَا زَالَ مُثَلَّثًا؟ نَعُدُّ: {اِلْمَسْ|اِلْمَسِي} كُلَّ رَأْسٍ.","wk.05":"ثَلَاثَةُ رُؤُوسٍ، وَثَلَاثَةُ أَضْلَاعٍ: مَا زَالَ مُثَلَّثًا!","wk.06":"وَالمُثَلَّثُ يَكُونُ طَوِيلًا رَفِيعًا، أَوْ عَرِيضًا، كَبِيرًا أَوْ صَغِيرًا.","wk.07":"وَهَذَانِ الشَّكْلَانِ؟ {اِلْمَسِ|اِلْمَسِي} الحَافَّةَ المُنْحَنِيَةَ فِي الأَوَّلِ.","wk.08":"وَ{اِلْمَسِ|اِلْمَسِي} الفَتْحَةَ فِي الثَّانِي.","wk.09":"إِذَا انْحَنَتْ إِحْدَى الحَوَافِّ، أَوْ كَانَ الشَّكْلُ مَفْتُوحًا، فَلَيْسَ مُثَلَّثًا.","pr.intro":"سِلَالُنَا: لِلْمُثَلَّثَاتِ، وَلِلْمُرَبَّعَاتِ، وَ«غَيْرُ ذَلِكَ». هَيَّا نَتَمَرَّنُ.","pr.mark":"أَيُّ هَذِهِ مُثَلَّثَاتٌ؟ {اِلْمَسْهَا|اِلْمَسِيهَا} كُلَّهَا، ثُمَّ {اِلْمَسْ|اِلْمَسِي} «تَمَّ».","pr.how":"كَمْ ضِلْعًا لِلْمُثَلَّثِ؟","pr.howV":"كَمْ رَأْسًا لِهَذَا المُرَبَّعِ؟","pr.howC":"كَمْ دَائِرَةً فِي الصُّورَةِ؟","game.01":"لُعْبَةُ بَيْتِ الأَشْكَالِ: {اِلْمَسْ|اِلْمَسِي} قِطْعَةً، ثُمَّ {اِلْمَسْ|اِلْمَسِي} مَكَانَهَا فِي البَيْتِ.","game.02":"بَيْتٌ كَامِلٌ!","why.t":"ثَلَاثَةُ أَضْلَاعٍ مُسْتَقِيمَةٍ، وَثَلَاثَةُ رُؤُوسٍ.","why.tRot":"ثَلَاثَةُ أَضْلَاعٍ مُسْتَقِيمَةٍ، مَهْمَا قَلَبْنَاهُ.","why.sq":"أَرْبَعَةُ أَضْلَاعٍ، فَلَيْسَ مُثَلَّثًا.","why.curved":"إِحْدَى حَوَافِّهِ مُنْحَنِيَةٌ، فَلَيْسَ مُثَلَّثًا.","why.open":"مَفْتُوحٌ، فِيهِ فَتْحَةٌ، فَلَيْسَ مُثَلَّثًا.","why.other":"لَيْسَ مُثَلَّثًا وَلَا مُرَبَّعًا.","ch.after":"ثَلَاثَةُ أَضْلَاعٍ: إِنَّهُ مُثَلَّثٌ مَقْلُوبٌ. مَكَانُهُ سَلَّةُ المُثَلَّثَاتِ.","ch.right":"المُثَلَّثُ المَقْلُوبُ مَا زَالَ مُثَلَّثًا: لَهُ ثَلَاثَةُ أَضْلَاعٍ.","ch.wrong":["chaos","المَقْلُوبُ لَيْسَ مُثَلَّثًا."],"ms.recallT":"المُثَلَّثُ ثَلَاثَةُ أَضْلَاعٍ مُسْتَقِيمَةٍ، مَهْمَا قَلَبْنَاهُ. وَالشَّكْلُ المَفْتُوحُ أَوِ المُنْحَنِي لَيْسَ مُثَلَّثًا.","ms.recallN":"نَلْمَسُ كُلَّ وَاحِدٍ مَرَّةً وَاحِدَةً، وَآخِرُ عَدَدٍ نَقُولُهُ هُوَ «كَمْ».","mx.tri":"أَيْنَ المُثَلَّثُ؟ {اِلْمَسْهُ|اِلْمَسِيهِ}.","ms.how6":"كَمْ شَيْئًا فِي الصَّفِّ؟","ms.ok":"رَائِعٌ! {أَتْقَنْتَ|أَتْقَنْتِ} المُثَلَّثَ وَالعَدَّ. {هَذِهِ نَجْمَتُكَ|هَذِهِ نَجْمَتُكِ}.","wrap.01":"بُيُوتُ الوَاحَةِ صَارَتْ لَهَا سُقُوفٌ مُثَلَّثَةٌ!","wrap.home":["chaos","مُهِمَّةُ البَيْتِ: {اِصْنَعْ|اِصْنَعِي} مُثَلَّثًا بِثَلَاثَةِ أَعْوَادٍ، وَ{عُدَّ|عُدِّي} أَطْبَاقَ المَائِدَةِ، وَ{الْمَسْ|الْمَسِي} كُلَّ طَبَقٍ وَأَنْتَ {تَعُدُّ|تَعُدِّينَ}."]},"flow":[{"s":"hook","scene":"roofFit","lines":["hook.01","hook.02","hook.03","hook.04"]},{"s":"explore","scene":"trace","mat":{"prompt":"mat.01","icon":true,"show":[],"after":"mat.02"},"shapes":[{"type":"triangle","kind":"triangle","w":190,"h":170,"color":"$id.triangle","x":180,"y":140,"caption":true,"capY":272}],"sides":true,"sidesIntro":"exp.sides","intro":"exp.01","after":["exp.03"]},{"s":"explore","scene":"countModel","lines":["n.01","n.02"]},{"s":"explore","scene":"items","mode":"explore","intro":"n.03","items":[{"t":"count","shape":"squareUp","what":"vertices","how":"pr.howV"}]},{"s":"explore","scene":"chaosDouble","lines":["n.04","n.05","n.06","n.07"]},{"s":"explore","scene": ":"paper","label":"bagPaper"},"napkin",{"icon":"tape","label":"bagTape"}],"ask":"bag.ask","adult":"ورقة دفتر مستطيلة، ومنديل مربع، وشريط ورقي.","screenPath":"على الشاشة يحاذي ويقارن بالسحب، ويُوسم «مدخل» حتى يقارن الأضلاع بطيّ الورقة الحقيقية."},"labels":{"bagPaper":"وَرَقَةُ دَفْتَرٍ","bagTape":"شَرِيطٌ مِنْ وَرَقٍ","rectName":"مُسْتَطِيل","squareName":"مُرَبَّع"},"lines":{"bag.ask":"هَلْ {مَعَكَ|مَعَكِ} وَرَقَةُ دَفْتَرٍ، وَمِنْدِيلٌ مُرَبَّعٌ، وَشَرِيطٌ مِنْ وَرَقٍ؟ أَمْ نَلْعَبُ عَلَى الشَّاشَةِ؟","hook.01":["chaos","بَنَيْتُ لِلْوَاحَةِ بَابًا جَمِيلًا!"],"hook.02":"جَاءَتِ الزَّرَافَةُ تَزُورُنَا. مِنْ أَيِّ بَابٍ تَدْخُلُ؟ {اِلْمَسْهُ|اِلْمَسِيهِ}.","hook.03":"رَأْسُهَا لَا يَمُرُّ! هَذَا البَابُ قَصِيرٌ. وَالآخَرُ؟","hook.04":"دَخَلَتْ مِنَ البَابِ الطَّوِيلِ! لَهُ ضِلْعَانِ طَوِيلَانِ، وَضِلْعَانِ قَصِيرَانِ.","hook.05":["chaos","وَكَيْفَ نَعْرِفُ الطَّوِيلَ مِنَ القَصِيرِ؟"],"mat.01":"{خُذْ|خُذِي} وَرَقَةَ الدَّفْتَرِ، وَ{اِطْوِهَا|اِطْوِيهَا} فَيَقَعَ ضِلْعٌ عَلَى ضِلْعٍ. أَيُّهُمَا أَطْوَلُ؟ ثُمَّ {اِلْمَسْ|اِلْمَسِي} «تَمَّ».","mat.02":"هَيَّا نُقَارِنُ عَلَى الشَّاشَةِ أَيْضًا.","c.01":"أَيُّ العُودَيْنِ أَطْوَلُ؟ قَبْلَ أَنْ نُقَارِنَ، {اِسْحَبِ|اِسْحَبِي} العُودَ الأَسْفَلَ حَتَّى يَبْدَأَ مِنَ الخَطِّ نَفْسِهِ.","c.02":"هَكَذَا: نَضَعُ بِدَايَتَهُ عَلَى الخَطِّ.","c.03":"الآنَ البِدَايَتَانِ مَعًا. أَيُّهُمَا أَطْوَلُ؟ {اِلْمَسْهُ|اِلْمَسِيهِ}.","c.04":"لِنُفَكِّرْ مَعًا: {اُنْظُرْ|اُنْظُرِي} إِلَى النِّهَايَتَيْنِ. أَيُّهُمَا يَصِلُ أَبْعَدَ؟","c.05":"العُودُ الأَعْلَى أَطْوَلُ. لَوْ لَمْ نَبْدَأْ مِنَ الخَطِّ نَفْسِهِ لَخُدِعْنَا!","exp.01":"{مَرِّرْ إِصْبَعَكَ|مَرِّرِي إِصْبَعَكِ} عَلَى حَافَّةِ هَذَا الشَّكْلِ، وَ{عُدَّ|عُدِّي} الرُّؤُوسَ.","exp.sides":"أَرْبَعَةُ رُؤُوسٍ! {اِلْمَسْ|اِلْمَسِي} كُلَّ ضِلْعٍ، وَ{لَاحِظِ|لَاحِظِي} الطَّوِيلَ وَالقَصِيرَ.","exp.03":"هَذَا مُسْتَطِيلٌ: أَرْبَعَةُ أَضْلَاعٍ مُسْتَقِيمَةٍ، وَكُلُّ ضِلْعَيْنِ مُتَقَابِلَيْنِ مُتَسَاوِيَانِ: طَوِيلَانِ وَقَصِيرَانِ. وَكُلُّ رُكْنٍ فِيهِ مِثْلُ رُكْنِ الوَرَقَةِ.","sq.01":"وَالمُرَبَّعُ؟ أَضْلَاعُهُ الأَرْبَعَةُ كُلُّهَا مُتَسَاوِيَةٌ، وَأَرْكَانُهُ مِثْلُ رُكْنِ الوَرَقَةِ.","sq.02":"فَالمُرَبَّعُ فِيهِ كُلُّ مَا فِي المُسْتَطِيلِ، وَزِيَادَةٌ: أَضْلَاعُهُ كُلُّهَا مُتَسَاوِيَةٌ. فَلَهُ اسْمٌ أَخَصُّ: مُرَبَّعٌ.","wk.01":"نُقَارِنُ الضِّلْعَيْنِ الطَّوِيلَيْنِ: نَضَعُ أَحَدَهُمَا عَلَى الآخَرِ بِشَرِيطٍ.","wk.02":"مُتَسَاوِيَانِ! وَالقَصِيرَانِ مُتَسَاوِيَانِ أَيْضًا.","wk.03":"هَلْ مَا زَالَ مُسْتَطِيلًا؟","wk.04":"ضِلْعَانِ طَوِيلَانِ وَضِلْعَانِ قَصِيرَانِ: مُسْتَطِيلٌ وَاقِفٌ، مِثْلُ البَابِ!","wk.05":"وَرُكْنُ الوَرَقَةِ يَنْطَبِقُ عَلَى كُلِّ رُكْنٍ فِيهِ.","pr.intro":"هَلْ هَذَا مُسْتَطِيلٌ؟ سِلَالُنَا: لِلْمُسْتَطِيلَاتِ، وَلِلْمُرَبَّعَاتِ، وَ«غَيْرُ ذَلِكَ».","acc.sq":"نَعَمْ، هُوَ مُسْتَطِيلٌ. وَلَهُ اسْمٌ أَخَصُّ: مُرَبَّعٌ.","why.r":"أَرْبَعَةُ أَضْلَاعٍ: ضِلْعَانِ طَوِيلَانِ وَضِلْعَانِ قَصِيرَانِ، وَكُلُّ رُكْنٍ مِثْلُ رُكْنِ الوَرَقَةِ.","why.rRot":"ضِلْعَانِ طَوِيلَانِ وَضِلْعَانِ قَصِيرَانِ، حَتَّى وَهُوَ مَائِلٌ.","why.sq":"أَضْلَاعُهُ الأَرْبَعَةُ مُتَسَاوِيَةٌ، وَأَرْكَانُهُ مِثْلُ رُكْنِ الوَرَقَةِ.","why.quad":"أَحَدُ أَرْكَانِهِ لَيْسَ مِثْلَ رُكْنِ الوَرَقَةِ.","why.open":"يَنْقُصُهُ ضِلْعٌ: فِيهِ فَتْحَةٌ.","why.other":"لَيْسَ لَهُ أَرْبَعَةُ أَضْلَاعٍ.","g.intro":"لُعْبَةُ «خَمِّنِ الشَّكْلَ»: {اِسْمَعِ|اِسْمَعِي} التَّلْمِيحَاتِ، وَ{اِلْمَسِ|اِلْمَسِي} الشَّكْلَ حِينَ {تَعْرِفُهُ|تَعْرِفِينَهُ}.","g.r1":"لِي أَرْبَعَةُ أَضْلَاعٍ…","g.r2":"اثْنَانِ مِنْهَا أَطْوَلُ مِنَ الآخَرَيْنِ…","g.r3":"وَكُلُّ رُكْنٍ فِيَّ مِثْلُ رُكْنِ الوَرَقَةِ. مَنْ أَنَا؟","g.t1":"حَوَافِّي كُلُّهَا مُسْتَقِيمَةٌ…","g.t2":"وَلِي ثَلَاثَةُ رُؤُوسٍ. مَنْ أَنَا؟","g.c1":"لَيْسَ لِي رُؤُوسٌ…","g.c2":"وَحَافَّتِي مُنْحَنِيَةٌ كُلُّهَا. مَنْ أَنَا؟","ch.after":"ضِلْعَانِ طَوِيلَانِ وَضِلْعَانِ قَصِيرَانِ: مُسْتَطِيلٌ وَاقِفٌ. مَكَانُهُ سَلَّةُ المُسْتَطِيلَاتِ.","ch.right":"المُسْتَطِيلُ الوَاقِفُ مَا زَالَ مُسْتَطِيلًا.","ch.wrong":["chaos","الوَاقِفُ عَمُودٌ، لَا مُسْتَطِيلٌ."],"ms.recall":"المُسْتَطِيلُ: ضِلْعَانِ طَوِيلَانِ وَضِل هل قال لماذا وضع الشيء في مجموعته؟"],"concept":"C005"},"lines":{"bag.ask":"هَلْ {مَعَكَ|مَعَكِ} صِينِيَّةٌ وَأَشْيَاءُ مُسَطَّحَةٌ مِنَ البَيْتِ؟ أَمْ نَلْعَبُ عَلَى الشَّاشَةِ؟","hook.01":["chaos","هِيهِي!"],"hook.02":"فَوْضَى بَعْثَرَتْ أَشْيَاءَ البَيْتِ! نَحْنُ صَيَّادُو الأَشْكَالِ: نَنْظُرُ إِلَى شَكْلِ كُلِّ شَيْءٍ، لَا إِلَى لَوْنِهِ وَلَا إِلَى اسْمِهِ.","mat.01":"{ضَعْ|ضَعِي} أَشْيَاءَ البَيْتِ عَلَى الصِّينِيَّةِ فِي أَرْبَعِ مَجْمُوعَاتٍ: دَوَائِرُ، وَمُرَبَّعَاتٌ، وَمُثَلَّثَاتٌ، وَمُسْتَطِيلَاتٌ. ثُمَّ {اِلْمَسْ|اِلْمَسِي} «تَمَّ».","mat.02":"وَالآنَ نَصْطَادُ عَلَى الشَّاشَةِ.","hunt.01":"{اِلْمَسْ|اِلْمَسِي} شَيْئًا، ثُمَّ {اِلْمَسْ|اِلْمَسِي} سَلَّةَ شَكْلِهِ.","hunt.02":"صَيْدٌ رَائِعٌ! كُلُّ شَيْءٍ فِي سَلَّةِ شَكْلِهِ.","sp.01":"{عُدَّ|عُدِّي} الدَّوَائِرَ: {اِلْمَسْ|اِلْمَسِي} كُلَّ وَاحِدَةٍ مَرَّةً.","sp.02":"خَمْسُ دَوَائِرَ.","sp.03":"هَلْ صَارَتْ أَكْثَرَ؟ هَيَّا نَعُدُّ مِنْ جَدِيدٍ.","sp.04":"مَا زَالَتْ خَمْسًا!","sp.05":"صَفٌّ، أَوْ دَائِرَةٌ، أَوْ مُبَعْثَرَةٌ: العَدَدُ لَا يَتَغَيَّرُ إِذَا تَغَيَّرَ التَّرْتِيبُ.","pd.01":"وَالآنَ: أَعْطِنِي خَمْسَةَ مُثَلَّثَاتٍ مِنَ الكَوْمَةِ.","pr.intro":"أَرْبَعُ سِلَالٍ: لِلدَّوَائِرِ، وَلِلْمُرَبَّعَاتِ، وَلِلْمُثَلَّثَاتِ، وَلِلْمُسْتَطِيلَاتِ. هَيَّا نَتَمَرَّنُ.","acc.sq":"نَعَمْ، هُوَ مُسْتَطِيلٌ. وَلَهُ اسْمٌ أَخَصُّ: مُرَبَّعٌ.","why.c":"حَافَّتُهُ مُنْحَنِيَةٌ، وَلَا رُؤُوسَ لَهُ.","why.sq":"أَرْبَعَةُ أَضْلَاعٍ مُتَسَاوِيَةٍ.","why.t":"ثَلَاثَةُ أَضْلَاعٍ مُسْتَقِيمَةٍ.","why.r":"ضِلْعَانِ طَوِيلَانِ وَضِلْعَانِ قَصِيرَانِ.","ch.after":"ضِلْعَانِ أَطْوَلُ مِنَ الآخَرَيْنِ: مَكَانُهُ سَلَّةُ المُسْتَطِيلَاتِ.","ch.right":"الظَّرْفُ مُسْتَطِيلٌ: ضِلْعَانِ طَوِيلَانِ وَضِلْعَانِ قَصِيرَانِ.","ch.wrong":["chaos","كُلُّ شَيْءٍ بِأَرْبَعَةِ أَضْلَاعٍ مُرَبَّعٌ."],"ms.basket":"أَيُّ هَذِهِ الأَشْيَاءِ مُثَلَّثَةُ الشَّكْلِ؟ {اِلْمَسْهَا|اِلْمَسِيهَا} كُلَّهَا، ثُمَّ «تَمَّ».","ms.recallC":"نَنْظُرُ إِلَى الشَّكْلِ: الدَّائِرَةُ بِلَا رُؤُوسٍ، وَالمُثَلَّثُ ثَلَاثَةُ أَضْلَاعٍ، وَالمُرَبَّعُ أ َذَا الصُّنْدُوقُ؟ {اُنْظُرْ|اُنْظُرِي} دَاخِلَهُ.","e.ask0":"كَمْ رِسَالَةً فِيهِ؟ أَيُّ بِطَاقَةٍ لَهُ؟","e.a0":"لَا شَيْءَ فِيهِ: صِفْرٌ. وَالصِّفْرُ عَدَدٌ لَهُ بِطَاقَةٌ، مِثْلُ غَيْرِهِ.","cards.01":"هَذِهِ بِطَاقَاتُ الأَرْقَامِ، مِنْ صِفْرٍ إِلَى عَشَرَةٍ. نَقْرَؤُهَا مَعًا.","cards.02":"{اِلْمَسْ|اِلْمَسِي} أَيَّ بِطَاقَةٍ {لِتَسْمَعَ|لِتَسْمَعِي} اسْمَهَا.","mat.01":"{اُكْتُبْ|اُكْتُبِي} بِإِصْبَعِكَ فِي الرَّمْلِ رَقْمَ ثَلَاثَة، ثُمَّ رَقْمَ خَمْسَة. ثُمَّ {اِلْمَسْ|اِلْمَسِي} «تَمَّ».","mat.02":"وَالآنَ نَكْتُبُ عَلَى الشَّاشَةِ.","tr.01":"نَكْتُبُ الرَّقْمَ: نَبْدَأُ مِنَ النُّقْطَةِ الخَضْرَاءِ، وَنَتْبَعُ الخَطَّ.","tr.02":"{أَحْسَنْتَ|أَحْسَنْتِ}! هَكَذَا نَكْتُبُ كُلَّ رَقْمٍ.","wk.01":"صُنْدُوقَانِ مُتَشَابِهَانِ. نَعُدُّ رَسَائِلَ كُلٍّ مِنْهُمَا، وَنُعَلِّقُ بِطَاقَتَهُ.","wk.02":"وَالرَّقْمَانِ مُتَشَابِهَانِ أَيْضًا. {اُنْظُرْ|اُنْظُرِي} إِلَى أَعْلَاهُمَا: فِي هَذَا سِنٌّ وَاحِدَةٌ، وَفِي ذَاكَ سِنَّانِ.","wk.03":"وَهَذَانِ الرَّقْمَانِ: أَحَدُهُمَا مَقْلُوبُ الآخَرِ. فَعَدُّ الرَّسَائِلِ هُوَ الَّذِي يَحْكُمُ.","pr.intro":"هَيَّا نَتَمَرَّنُ عَلَى الأَرْقَامِ.","g.intro":"لُعْبَةُ سَاعِي البَرِيدِ: عَلَى كُلِّ صُنْدُوقٍ بِطَاقَةٌ، {فَضَعْ|فَضَعِي} فِيهِ مَا تَقُولُهُ.","ch.find":"فَوْضَى عَلَّقَتْ بِطَاقَةً عَلَى هَذَا الصُّنْدُوقِ. هَلْ هِيَ بِطَاقَتُهُ؟ {عُدَّ|عُدِّي} الرَّسَائِلَ: {اِلْمَسْ|اِلْمَسِي} كُلَّ رِسَالَةٍ.","ch.after":"عَلَّقْنَا بِطَاقَتَهُ الصَّحِيحَةَ.","ch.right":"نَعُدُّ الرَّسَائِلَ، لِنَعْرِفَ البِطَاقَةَ.","ch.wrong":["chaos","سَبْعَةٌ وَثَمَانِيَةٌ مُتَشَابِهَانِ، فَلَا فَرْقَ."],"ms.recall":"لِكُلِّ عَدَدٍ رَقْمٌ: نَعُدُّ الرَّسَائِلَ، ثُمَّ نَبْحَثُ عَنْ رَقْمِهَا. وَالصُّنْدُوقُ الفَارِغُ رَقْمُهُ صِفْرٌ.","ms.ok":"رَائِعٌ! {صِرْتَ تَقْرَأُ|صِرْتِ تَقْرَئِينَ} أَرْقَامَ الوَاحَةِ {وَتَكْتُبُهَا|وَتَكْتُبِينَهَا}. {هَذِهِ نَجْمَتُكَ|هَذِهِ نَجْمَتُكِ}.","wrap.01":"صَارَ لِصَنَادِيقِ البَرِيدِ فِي الوَاحَةِ بِطَاقَاتٌ بِأَرْقَامِهَا!","wrap.02":"وَمِنَ اليَوْمِ {تَسْتَطِيعُ|تَسْتَطِيعِينَ} أَنْ {تَخْتَارَ|تَخْتَارِي}  سُطُوحٌ مُسَطَّحَةٌ وَرُؤُوسٌ.","mat.01":"خَبِّئُوا الكُرَةَ وَالنَّرْدَ فِي الكِيسِ. {أَدْخِلْ يَدَكَ|أَدْخِلِي يَدَكِ} دُونَ أَنْ {تَنْظُرَ|تَنْظُرِي}، وَ{أَخْرِجِ|أَخْرِجِي} الكُرَةَ. ثُمَّ {اِلْمَسْ|اِلْمَسِي} «تَمَّ».","mat.02":"كَيْفَ {عَرَفْتَهَا|عَرَفْتِهَا} {بِيَدِكَ|بِيَدِكِ}؟ هَيَّا نُجَرِّبُ عَلَى الشَّاشَةِ.","push.sphere":"سَنَدْفَعُ الكُرَةَ. هَلْ تَتَدَحْرَجُ، أَمْ تَبْقَى مَكَانَهَا؟ {تَوَقَّعْ|تَوَقَّعِي}.","push.sphere.after":"تَدَحْرَجَتِ الكُرَةُ بَعِيدًا! وَتَتَدَحْرَجُ فِي كُلِّ اتِّجَاهٍ.","push.cube":"وَالآنَ المُكَعَّبُ. هَلْ يَتَدَحْرَجُ مِثْلَ الكُرَةِ، أَمْ يَقِفُ؟ {تَوَقَّعْ|تَوَقَّعِي}.","push.cube.after":"انْقَلَبَ المُكَعَّبُ مَرَّةً وَاحِدَةً، ثُمَّ وَقَفَ ثَابِتًا. لَا يَتَدَحْرَجُ.","pose.01":"وَالمُكَعَّبُ عَلَى وَجْهٍ، أَوْ عَلَى أَحَدِ رُؤُوسِهِ، يَبْقَى مُكَعَّبًا.","pose.02":"الكُرَةُ وَالمُكَعَّبُ مُجَسَّمَانِ: المُجَسَّمُ يَمْلَأُ الكَفَّ، وَلَهُ سُمْكٌ.","pose.03":"وَهَذِهِ صُوَرُ مُجَسَّمَاتٍ؛ المُجَسَّمُ الحَقِيقِيُّ نُمْسِكُهُ بِأَيْدِينَا.","wk.01":"هَذَا مُكَعَّبٌ: وُجُوهُهُ مُسَطَّحَةٌ، وَيَقِفُ ثَابِتًا.","wk.02":"هَلْ مَا زَالَ مُكَعَّبًا؟","wk.03":"مَا زَالَ يَمْلَأُ الكَفَّ، وَإِذَا أَرْسَلْنَاهُ وَقَفَ عَلَى وَجْهٍ: مَا زَالَ مُكَعَّبًا!","wk.04":"المُرَبَّعُ الوَرَقِيُّ رَقِيقٌ بِلَا سُمْكٍ. أَمَّا المُكَعَّبُ فَيَمْلَأُ الكَفَّ.","wk.05":"وَالدَّائِرَةُ الوَرَقِيَّةُ رَقِيقَةٌ بِلَا سُمْكٍ. أَمَّا الكُرَةُ فَتَمْلَأُ الكَفَّ.","wk.06":"وَالبُرْتُقَالَةُ شَبِيهَةٌ بِالكُرَةِ: تَتَدَحْرَجُ، لَكِنَّهَا لَيْسَتْ كُرَةً تَامَّةً.","pr.intro":"سِلَالُنَا: لِلْمُكَعَّبَاتِ، وَلِلْكُرَاتِ، وَ«غَيْرُ ذَلِكَ». هَيَّا نَتَمَرَّنُ.","pr.rolls":"أَيُّ هَذِهِ الأَشْيَاءِ تَتَدَحْرَجُ؟ {اِلْمَسْهَا|اِلْمَسِيهَا} كُلَّهَا، ثُمَّ «تَمَّ».","pr.odd":"ثَلَاثَةٌ مِنْ هَذِهِ شَبِيهَةٌ بِالكُرَةِ، وَوَاحِدٌ مُخْتَلِفٌ. {اِلْمَسِ|اِلْمَسِي} المُخْتَلِفَ.","game.01":"لُعْبَةُ صُنْدُوقِ اللَّمْسِ: {اِسْمَعِ|اِسْمَعِي} مَا يَقُولُهُ الشَّيْءُ عَنْ نَفْسِهِ، وَ{اِخْتَرْهُ|اِخْتَارِيهِ}.","fb.1":"أَتَدَحْرَجُ فِي كُلِّ اتِّجَاهٍ، وَلَيْسَ لِي رُؤُوسٌ. مَنْ أَنَا؟","fb.2":"أَقِفُ ثَابِتًا، وَوُجُوهِي كُلُّهَا مُسَطَّحَةٌ. مَنْ أَنَا؟","fb.3":"إِذَا {دَفَعْتَنِي|دَفَعْتِنِي} انْقَلَبْتُ مَرَّةً وَوَقَفْتُ. مَنْ أَنَا؟","why.cube":"وُجُوهُهُ مُسَطَّحَةٌ، وَيَقِفُ ثَابِتًا.","why.cubeTurned":"وُجُوهُهُ مُسَطَّحَةٌ، حَتَّى وَهُوَ مَائِلٌ.","why.sphere":"سَطْحُهُ مُنْحَنٍ كُلُّهُ، وَيَتَدَحْرَجُ.","why.flat":"رَقِيقٌ بِلَا سُمْكٍ: لَيْسَ مُجَسَّمًا.","why.box":"لَهُ وُجُوهٌ مُسَطَّحَةٌ، لَكِنَّهَا لَيْسَتْ كُلُّهَا مُرَبَّعَاتٍ: لَيْسَ مُكَعَّبًا.","why.other":"لَيْسَ مُكَعَّبًا وَلَا كُرَةً.","ch.after":"صَارَ خَطًّا رَقِيقًا: مُرَبَّعٌ مِنْ وَرَقٍ. مَكَانُهُ «غَيْرُ ذَلِكَ».","ch.right":"المُرَبَّعُ الوَرَقِيُّ رَقِيقٌ بِلَا سُمْكٍ، وَالمُكَعَّبُ يَمْلَأُ الكَفَّ.","ch.wrong":["chaos","المُرَبَّعُ وَالمُكَعَّبُ شَيْءٌ وَاحِدٌ."],"ms.recall6":"المُكَعَّبُ وُجُوهُهُ مُسَطَّحَةٌ، مَهْمَا أَدَرْنَاهُ. وَالكُرَةُ سَطْحُهَا مُنْحَنٍ. وَالوَرَقُ رَقِيقٌ بِلَا سُمْكٍ.","ms.recall9":"مَا لَهُ سَطْحٌ مُنْحَنٍ يَتَدَحْرَجُ، وَمَا لَهُ وُجُوهٌ مُسَطَّحَةٌ يَقِفُ.","ms.ok":"رَائِعٌ! {أَتْقَنْتَ|أَتْقَنْتِ} المُكَعَّبَ وَالكُرَةَ. {هَذِهِ نَجْمَتُكَ|هَذِهِ نَجْمَتُكِ}.","wrap.01":"فِي الوَاحَةِ الآنَ بُرْجٌ مِنَ المُكَعَّبَاتِ، وَكُرَةٌ تَتَدَحْرَجُ!","wrap.home":["chaos","مُهِمَّةُ البَيْتِ: {دَحْرِجْ|دَحْرِجِي} مَعَ الكِبَارِ كُرَةً وَعُلْبَةً عَلَى الأَرْضِ: أَيُّهُمَا تَتَدَحْرَجُ؟ وَلِمَاذَا تَقِفُ الأُخْرَى؟"]},"flow":[{"s":"hook","scene":"bagFeel","lines":["hook.01"],"feel":{"sphere":"feel.sphere","cube":"feel.cube"},"ask":"hook.ask","is":{"sphere":"is.sphere","cube":"is.cube"},"after":"hook.03"},{"s":"explore","scene":"pushLab","mat":{"prompt":"mat.01","show":["ball","die"],"after":"mat.02"},"rounds":[{"mk":{"solid":"sphere","kind":"sphere","size":92,"color":"$solid.sphere"},"behave":"roll","ok":"roll","k":"f","ask":"push.sphere","after":"push.sphere.after"},{"mk":{"solid":"cube","kind":"cube","size":96,"color":"$solid.cube"},"behave":"tip","ok":"stay","ask":"push.cube","after":"push.cube.after"}]},{"s":"ex :"riddle"},"u2r6":{"riddle":["shop.r6"],"kind":"cylinder","opts":["sphere","cylinder","cone"],"tag":"riddle"}},"lines":{"bag.ask":"هَلْ {مَعَكَ|مَعَكِ} لَفَّةُ مَنَادِيلَ، وَقُبَّعَةُ حَفْلَةٍ؟ أَمْ نَلْعَبُ عَلَى الشَّاشَةِ؟","hook.01":"فَوْضَى أَنَامَتِ المَخْرُوطَ، وَسَتَدْفَعُهُ نَحْوَ بَابِ الوَاحَةِ. هَلْ يَسِيرُ فِي خَطٍّ مُسْتَقِيمٍ، أَمْ يَدُورُ؟ {تَوَقَّعْ|تَوَقَّعِي}.","hook.02":"نَنْظُرُ إِلَيْهِ مِنْ فَوْقُ.","hook.03":"دَارَ حَوْلَ رَأْسِهِ! رَأْسُهُ يَبْقَى فِي مَكَانِهِ، وَقَاعِدَتُهُ تَدُورُ حَوْلَهُ.","hook.04":["chaos","إِذَنْ، مَنْ يَتَدَحْرَجُ فِي خَطٍّ مُسْتَقِيمٍ؟"],"mat.01":"{أَنِمْ|أَنِيمِي} لَفَّةَ المَنَادِيلِ وَ{دَحْرِجْهَا|دَحْرِجِيهَا}، ثُمَّ {أَنِمِ|أَنِيمِي} القُبَّعَةَ وَ{دَحْرِجْهَا|دَحْرِجِيهَا}. مَاذَا {رَأَيْتَ|رَأَيْتِ}؟ ثُمَّ {اِلْمَسْ|اِلْمَسِي} «تَمَّ».","mat.02":"هَيَّا نَرَى ذَلِكَ عَلَى الشَّاشَةِ أَيْضًا.","cyl.01":"هَذِهِ أُسْطُوَانَةٌ نَائِمَةٌ، نَنْظُرُ إِلَيْهَا مِنْ فَوْقُ. {اِلْمَسْهَا|اِلْمَسِيهَا} لِنُدَحْرِجَهَا.","cyl.02":"تَدَحْرَجَتِ الأُسْطُوَانَةُ فِي خَطٍّ مُسْتَقِيمٍ.","push.cyl":"وَإِذَا كَانَتِ الأُسْطُوَانَةُ وَاقِفَةً، هَلْ تَتَدَحْرَجُ إِذَا دَفَعْنَاهَا؟","push.cyl.after":"بَقِيَتْ وَاقِفَةً عَلَى طَرَفِهَا الدَّائِرِيِّ المُسَطَّحِ.","push.end":"وَإِذَا نَامَتْ عَلَى جَانِبِهَا؟","push.end.after":"تَدَحْرَجَتْ عَلَى سَطْحِهَا المُنْحَنِي. الأُسْطُوَانَةُ تَقِفُ، وَتَتَدَحْرَجُ.","cone.01":"وَقُبَّعَةُ الحَفْلَةِ مَخْرُوطٌ: قَاعِدَتُهُ دَائِرِيَّةٌ مُسَطَّحَةٌ، وَرَأْسُهُ مُدَبَّبٌ. وَلِسَطْحِهِ المُنْحَنِي يَتَدَحْرَجُ حَوْلَ رَأْسِهِ.","face.cube":"السَّطْحُ المُسَطَّحُ مِنَ المُجَسَّمِ اسْمُهُ: وَجْهٌ، نَلْمَسُهُ بِكَفِّنَا. {اِلْمَسِ|اِلْمَسِي} وُجُوهَ المُكَعَّبِ.","face.cube.after":"كُلُّ وُجُوهِ المُكَعَّبِ مُسَطَّحَةٌ.","face.cyl":"{اِلْمَسِ|اِلْمَسِي} وَجْهَ الأُسْطُوَانَةِ المُسَطَّحَ.","face.cyl.flip":"نَقْلِبُهَا… وَهُنَاكَ وَجْهٌ آخَرُ. {اِلْمَسْهُ|اِلْمَسِيهِ}.","face.cyl.after":"لِلْأُسْطُوَانَةِ وَجْهَانِ دَائِرِيَّانِ مُسَطَّحَانِ، وَبَيْنَهُمَا سَطْحٌ مُنْحَنٍ.","face.cone":"وَالمَخْرُوطُ؟ قَلَبْنَاهُ لِنَرَى قَاعِدَتَهُ. {اِلْمَسِ|اِلْمَسِي} وَجْهَهُ المُسَطَّحَ.","face.cone.after":"لِلْمَخْرُوطِ وَجْهٌ دَائِرِيٌّ وَاحِدٌ، وَرَأْسٌ مُدَبَّبٌ.","face.sphere":"وَالكُرَةُ؟ {اِلْمَسْهَا|اِلْمَسِيهَا}.","face.sphere.after":"سَطْحُ الكُرَةِ مُنْحَنٍ كُلُّهُ: لَيْسَ لَهَا وَجْهٌ مُسَطَّحٌ.","wk.01":"هَذِهِ طَبْلَةٌ: وَجْهَانِ دَائِرِيَّانِ مُسَطَّحَانِ، وَسَطْحٌ مُنْحَنٍ. إِنَّهَا أُسْطُوَانَةٌ.","wk.02":"هَلْ مَا زَالَتْ أُسْطُوَانَةً؟","wk.03":"مَا زَالَ لَهَا الوَجْهَانِ الدَّائِرِيَّانِ: أُسْطُوَانَةٌ نَائِمَةٌ.","wk.04":"قُبَّعَةُ الحَفْلَةِ وَقِمْعُ البُوظَةِ مَخْرُوطَانِ: رَأْسٌ مُدَبَّبٌ وَقَاعِدَةٌ دَائِرِيَّةٌ، حَتَّى لَوْ كَانَ الرَّأْسُ إِلَى الأَسْفَلِ.","pr.intro":"سِلَالُنَا: لِلْأُسْطُوَانَاتِ، وَلِلْمَخَارِيطِ، وَ«غَيْرُ ذَلِكَ». هَيَّا نَتَمَرَّنُ.","pr.who":"مَنْ أَنَا؟ أَقِفُ وَأَتَدَحْرَجُ، وَلِي وَجْهَانِ دَائِرِيَّانِ.","pr.coneRoll":"هَلْ يَتَدَحْرَجُ المَخْرُوطُ فِي خَطٍّ مُسْتَقِيمٍ؟","pr.coneWhy":"يَدُورُ حَوْلَ رَأْسِهِ، لِأَنَّ رَأْسَهُ يَبْقَى فِي مَكَانِهِ.","game.01":"مَتْجَرُ المُجَسَّمَاتِ: {اِسْمَعْ|اِسْمَعِي} طَلَبَ كُلِّ زَبُونٍ، وَ{أَعْطِهِ|أَعْطِيهِ} مَا يَطْلُبُ.","shop.r1":"زَبُونٌ يَطْلُبُ شَيْئًا يَقِفُ، وَيَتَدَحْرَجُ فِي خَطٍّ مُسْتَقِيمٍ.","shop.r2":"زَبُونَةٌ تَطْلُبُ شَيْئًا رَأْسُهُ مُدَبَّبٌ، وَقَاعِدَتُهُ دَائِرِيَّةٌ.","shop.r3":"زَبُونٌ يَطْلُبُ شَيْئًا يَتَدَحْرَجُ فِي كُلِّ اتِّجَاهٍ، وَلَيْسَ لَهُ وَجْهٌ مُسَطَّحٌ.","shop.r4":"زَبُونَةٌ تَطْلُبُ شَيْئًا لَهُ وَجْهَانِ دَائِرِيَّانِ مُسَطَّحَانِ.","shop.r5":"زَبُونٌ يَطْلُبُ شَيْئًا يَدُورُ حَوْلَ رَأْسِهِ إِذَا دَحْرَجْنَاهُ.","shop.r6":"زَبُونَةٌ تَطْلُبُ شَيْئًا تُوقِفُهُ فَيَقِفُ، وَإِذَا أَنَامَتْهُ تَدَحْرَجَ فِي خَطٍّ مُسْتَقِيمٍ.","why.cyl":"وَجْهَانِ دَائِرِيَّانِ، وَسَطْحٌ مُنْحَنٍ بَيْنَهُمَا.","why.cylLying":"نَائِمَةٌ فَقَطْ: مَا زَالَ لَهَا وَجْهَانِ دَائِرِيَّانِ.","why.cone":"رَأْسٌ مُدَبَّبٌ، وَقَاعِدَةٌ دَائِرِيَّةٌ، مَهْمَا قَلَبْنَاهُ.","why.other":"لَيْسَ لَهُ وَجْهٌ دَائِرِيٌّ وَرَأْسٌ مُدَبَّبٌ، وَلَا وَجْهَانِ دَائِرِيَّانِ.","ch.after":"لَهَا وَجْهَانِ دَائِرِيَّانِ: إِنَّهَا أُسْطُوَانَةٌ نَائِمَةٌ. مَكَانُهَا سَلَّةُ الأُسْطُوَانَاتِ.","ch.right":"الأُسْطُوَانَةُ النَّائِمَةُ مَا زَالَتْ أُسْطُوَانَةً: لَهَا وَجْهَانِ دَائِرِيَّانِ.","ch.wrong":["chaos","النَّائِمَةُ لَيْسَتْ أُسْطُوَانَةً."],"ms.cylCone":"لِلْأُسْطُوَانَةِ وَجْهَانِ دَائِرِيَّانِ، وَاقِفَةً أَوْ نَائِمَةً. وَلِلْمَخْرُوطِ رَأْسٌ مُدَبَّبٌ وَقَاعِدَةٌ دَائِرِيَّةٌ.","ms.faces":"الوَجْهُ سَطْحٌ مُسَطَّحٌ نَلْمَسُهُ بِكَفِّنَا، وَالكُرَةُ لَيْسَ لَهَا وَجْهٌ مُسَطَّحٌ.","ms.sphereFace":"هَلْ لِلْكُرَةِ وَجْهٌ مُسَطَّحٌ؟","ms.cylFace":"{اِلْمَسِ|اِلْمَسِي} أَحَدَ وَجْهَيِ الأُسْطُوَانَةِ.","ms.ok":"رَائِعٌ! {أَتْقَنْتَ|أَتْقَنْتِ} الأُسْطُوَانَةَ وَالمَخْرُوطَ وَالوُجُوهَ. {هَذِهِ نَجْمَتُكَ|هَذِهِ نَجْمَتُكِ}.","wrap.01":"فِي الوَاحَةِ الآنَ بُرْجُ مَاءٍ: أُسْطُوَانَةٌ فَوْقَهَا مَخْرُوطٌ!","wrap.home":["chaos","مُهِمَّةُ البَيْتِ: {اِبْحَثْ|اِبْحَثِي} فِي البَيْتِ عَنْ أُسْطُوَانَةٍ وَمَخْرُوطٍ، وَ{دَحْرِجْهُمَا|دَحْرِجِيهِمَا}: أَيُّهُمَا يَسِيرُ فِي خَطٍّ مُسْتَقِيمٍ؟"]},"flow":[{"s":"hook","scene":"coneRoll","lines":["hook.01","hook.02","hook.03","hook.04"]},{"s":"explore","scene":"cylRoll","mat":{"prompt":"mat.01","icon":true,"show":[],"after":"mat.02"},"lines":["cyl.01","cyl.02"]},{"s":"explore","scene":"pushLab","rounds":[{"mk":{"solid":"cylinder","kind":"cylinder","size":110,"color":"$solid.cylinder"},"behave":"stay","ok":"stay","k":"f","ask":"push.cyl","after":"push.cyl.after"},{"mk":{"solid":"cylinder","kind":"cylinder","size":104,"color":"$solid.cylinder","pose":"end"},"behave":"roll","ok":"roll","k":"f","ask":"push.end","after":"push.end.after"}]},{"s":"explore","scene":"poses","show":[{"solid":"cone","kind":"cone","size":110,"color":"$solid.cone"},"hat",{"solid":"cone","kind":"cone","size":110,"color":"$solid.cone","pose":"lying"}],"lines":["cone.01"]},{"s":"explore","scene":"faceLab","rounds":[{"mk":{"solid":"cube","kind":"cube","size":130,"color":"$solid.cube","pose":"turned"},"faces":["front","top", ا. أَمَّا الكُرَاتُ فَتَتَدَحْرَجُ، فَلَا نُكَدِّسُهَا.","mat.01":"{اِبْنِ|اِبْنِي} بُرْجًا مِنْ سَبْعَةِ مُكَعَّبَاتٍ، وَبُرْجًا مِنْ خَمْسَةٍ، بِجَانِبِ بَعْضِهِمَا. ثُمَّ {اِلْمَسْ|اِلْمَسِي} «تَمَّ».","mat.02":"نُقَابِلُ البُرْجَيْنِ عَلَى الشَّاشَةِ.","ex.01":"بُرْجَانِ مِنْ مُكَعَّبَاتٍ مُتَشَابِهَةٍ. نُقَابِلُ كُلَّ مُكَعَّبٍ بِمُكَعَّبٍ: الَّذِي بَقِيَ فِيهِ مُكَعَّبَاتٌ بِلَا مُقَابِلٍ هُوَ الأَكْثَرُ.","ex.02":"سَبْعَة وَخَمْسَة: سَبْعَةٌ أَكْثَرُ مِنْ خَمْسَةٍ. وَإِنْ تَقَابَلَتْ كُلُّهَا فَهُمَا مُتَسَاوِيَانِ.","ex.03":"وَعَلَى البِطَاقَتَيْنِ رَقْمَانِ: العَدَدُ الأَكْبَرُ هُوَ الَّذِي فِي بُرْجِهِ مُكَعَّبَاتٌ أَكْثَرُ.","ex.04":"وَالآنَ بُرْجَا فَوْضَى: المُكَعَّبَاتُ مُخْتَلِفَةُ الحَجْمِ. نُقَابِلُ، وَنَعُدُّ.","ex.05":"بُرْجُ المُكَعَّبَاتِ الصَّغِيرَةِ فِيهِ أَكْثَرُ، مَعَ أَنَّهُ أَقْصَرُ!","wk.01":"بُرْجَانِ: أُقَابِلُ كُلَّ مُكَعَّبٍ بِمُكَعَّبٍ.","wk.02":"هَذَانِ المُكَعَّبَانِ زَائِدَانِ بِلَا مُقَابِلٍ، فَالأَوَّلُ أَكْثَرُ.","wk.03":"وَهَذَانِ البُرْجَانِ: تَقَابَلَتْ كُلُّ مُكَعَّبَاتِهِمَا، فَهُمَا مُتَسَاوِيَانِ.","pr.intro":"هَيَّا نُقَارِنُ.","ch.find":"فَوْضَى رَفَعَتْ عَلَمَ «أَكْثَرُ» عَلَى البُرْجِ الأَعْلَى. نُقَابِلُ المُكَعَّبَاتِ: أَيْنَ يَجِبُ أَنْ يَكُونَ العَلَمُ؟ {اِلْمَسِ|اِلْمَسِي} البُرْجَ.","ch.after":"نَقَلْنَا العَلَمَ إِلَى البُرْجِ الَّذِي فِيهِ مُكَعَّبَاتٌ أَكْثَرُ.","ch.right":"نَعُدُّ المُكَعَّبَاتِ، لَا نَنْظُرُ إِلَى الارْتِفَاعِ.","ch.wrong":["chaos","الأَعْلَى دَائِمًا أَكْثَرُ."],"ms.recall":"نُقَابِلُ وَاحِدًا بِوَاحِدٍ: مَا بَقِيَ بِلَا مُقَابِلٍ هُوَ الأَكْثَرُ. وَالعَدَدُ الأَكْبَرُ يَعْنِي مُكَعَّبَاتٍ أَكْثَرَ، لَا مُكَعَّبَاتٍ أَضْخَمَ.","ms.ok":"رَائِعٌ! {صِرْتَ تُقَارِنُ|صِرْتِ تُقَارِنِينَ} بِالمُقَابَلَةِ وَالعَدِّ. {هَذِهِ نَجْمَتُكَ|هَذِهِ نَجْمَتُكِ}.","wrap.01":"فِي الوَاحَةِ الآنَ أَبْرَاجٌ، وَنَعْرِفُ أَيُّهَا أَكْثَرُ!","wrap.home":["chaos","مُهِمَّةُ البَيْتِ: {اِبْنِ|اِبْنِي} بُرْجَيْنِ مِنْ أَشْيَاءِ البَيْتِ، وَ{قَابِلْ|قَابِلِي} بَيْنَهُمَا: أَيُّهُمَا أَكْثَرُ؟"]},"flow":[{"s":"hook "bins":["cylinder","cone","other"]}},"ok":"ms.ok"},"review":[{"t":"cmpDigits","a":5,"b":2},{"t":"compare","a":8,"b":6}],"wrap":{"art":"towers","lines":["wrap.01"],"home":"wrap.home"},"talk":"ضعوا صفّين من الملاعق، أحدهما متباعد، واسألوا: «أيّهما أكثر؟ كيف {عرفتَ|عرفتِ}؟» الجواب المنتظر: نقابل ملعقة بملعقة، أو نعدّ."},{"id":"m1.u2.d4","title":"مُسَطَّحٌ أَمْ مُجَسَّمٌ؟","icon":["flat"],"concepts":{"C008":"التمييز بين المسطّح والمجسّم (مدخل على الشاشة، ويحكم الكبير)","N005":"تفكيك العدد حتى 10 إلى جزأين بطرق عدة"},"bag":{"items":["cube",{"icon":"paper","label":"bagPaper"},{"icon":"cubes","label":"bagCubes"}],"ask":"bag.ask","adult":"مكعب، وورقة وقلم، وستة مكعبات بلونين.","screenPath":"الختم والفرز على الشاشة «مدخل» دائماً للتمييز بين المسطّح والمجسّم، ويحكم الكبير ببطاقة الأسئلة الثلاثة."},"labels":{"bagPaper":"وَرَقَةٌ وَقَلَمٌ","bagCubes":"سِتَّةُ مُكَعَّبَاتٍ بِلَوْنَيْنِ","flatName":"مُسَطَّح","solidName":"مُجَسَّم"},"adultCard":{"title":"مسطّح أم مجسّم؟ (لا يُتعلَّم من الشاشة)","how":"بأشياء حقيقية في يد الطفل، أجيبوا:","concept":"C008","qs":["أعطيتموه دائرة ورقية وكرة وسألتم: «أيّهما يملأ الكفّ؟» فأشار إلى الكرة.","رسم حول وجه المكعب على ورقة، وقال إن الشكل مربع.","أراكم شيئاً مسطّحاً وشيئاً مجسّماً في الغرفة."]},"lines":{"bag.ask":"هَلْ {مَعَكَ|مَعَكِ} مُكَعَّبٌ، وَوَرَقَةٌ وَقَلَمٌ، وَسِتَّةُ مُكَعَّبَاتٍ بِلَوْنَيْنِ؟ أَمْ نَلْعَبُ عَلَى الشَّاشَةِ؟","hook.01":"فَوْضَى رَسَمَتْ دَائِرَةً عَلَى وَرَقَةٍ، وَسَتَدْفَعُ الوَرَقَةَ. هَلْ تَتَدَحْرَجُ الدَّائِرَةُ المَرْسُومَةُ؟ {تَوَقَّعْ|تَوَقَّعِي}.","hook.02":"انْزَلَقَتِ الوَرَقَةُ قَلِيلًا، وَلَمْ تَتَدَحْرَجْ: الدَّائِرَةُ مَرْسُومَةٌ عَلَى الوَرَقِ، لَيْسَتْ كُرَةً.","hook.03":["chaos","أُوه… أَيْنَ كُرَتِي إِذَنْ؟"],"mat.01":"{اِرْسُمْ|اِرْسُمِي} حَوْلَ وَجْهِ المُكَعَّبِ عَلَى الوَرَقَةِ. مَا الشَّكْلُ الَّذِي ظَهَرَ؟ ثُمَّ {اِلْمَسْ|اِلْمَسِي} «تَمَّ».","mat.02":"وَالآنَ نَخْتِمُ عَلَى الشَّاشَةِ.","stamp.cube":"نَضَعُ وَجْهَ المُكَعَّبِ عَلَى الحِبْرِ، ثُمَّ عَلَى الوَرَقَةِ. مَا شَكْلُ البَصْمَةِ؟ {تَوَقَّعْ|تَوَقَّعِي}.","stamp.cube.after":"مُرَبَّعٌ! وَجْهُ المُكَعَّبِ يَتْرُكُ بَصْمَةً مُرَبَّعَةً.","stamp.cyl":"وَالأُسْطُوَانَةُ عَلَى وَجْهِهَا؟","stamp.cyl.after":"دَائِرَةٌ! وَجْهُ الأُسْطُوَانَةِ دَائِرِيٌّ.","stamp.cone":"وَالمَخْرُوطُ عَلَى قَاعِدَتِهِ؟","stamp.cone.after":"دَائِرَةٌ أَيْضًا! قَاعِدَةُ المَخْرُوطِ دَائِرِيَّةٌ.","stamp.sphere":"وَالكُرَةُ؟","stamp.sphere.after":"نُقْطَةٌ صَغِيرَةٌ فَقَطْ: لَيْسَ لِلْكُرَةِ وَجْهٌ مُسَطَّحٌ يَتْرُكُ بَصْمَةً.","stamp.rule":"المُسَطَّحُ نَرْسُمُهُ وَنَقُصُّهُ، وَالمُجَسَّمُ يَمْلَأُ الكَفَّ. وَوُجُوهُ المُجَسَّمِ المُسَطَّحَةُ تَتْرُكُ بَصْمَةً مُسَطَّحَةً.","wk.01":"{شَاهِدْ|شَاهِدِي}: نُدِيرُ المُرَبَّعَ الوَرَقِيَّ وَالمُكَعَّبَ مَعًا.","wk.02":"المُرَبَّعُ الوَرَقِيُّ صَارَ خَطًّا رَقِيقًا: لَيْسَ لَهُ سُمْكٌ. وَالمُكَعَّبُ بَقِيَ كُتْلَةً تَمْلَأُ الكَفَّ.","wk.03":"دَائِرَةٌ مِنْ وَرَقٍ، وَمُرَبَّعٌ مَرْسُومٌ، وَأُسْطُوَانَةٌ: مُسَطَّحٌ، وَمُسَطَّحٌ، وَمُجَسَّمٌ.","pr.intro":"سَلَّتَانِ: لِلْمُسَطَّحِ، وَلِلْمُجَسَّمِ. وَبَعْدَهَا البُرْجُ بِلَوْنَيْنِ.","tb.01":"هَيَّا نَبْنِي بُرْجًا مِنَ المُجَسَّمَاتِ! {اِلْمَسْ|اِلْمَسِي} مُجَسَّمًا فَيَنْزِلُ فَوْقَ البُرْجِ. نُرِيدُ خَمْسَةَ طَوَابِقَ.","tb.02":"بُرْجٌ ثَابِتٌ!","tb.03":"{عُدَّ|عُدِّي}: كَمْ مُجَسَّمًا فِي {بُرْجِكَ|بُرْجِكِ}؟ {اِلْمَسْ|اِلْمَسِي} كُلَّ طَابِقٍ.","tb.04":"وَفِي القَاعِدَةِ مُجَسَّمٌ يَقِفُ ثَابِتًا، وَالكُرَاتُ لَا نُكَدِّسُهَا.","tb.sphere":"تَدَحْرَجَتِ الكُرَةُ، فَسَقَطَ مَا فَوْقَهَا! الكُرَةُ لَا تَصْلُحُ تَحْتَ شَيْءٍ.","tb.cone":"رَأْسُ المَخْرُوطِ مُدَبَّبٌ، لَا يَقِفُ عَلَيْهِ شَيْءٌ. المَخْرُوطُ يَصْلُحُ سَقْفًا فِي الأَعْلَى.","sp.01":"البُرْجُ نَفْسُهُ بِلَوْنَيْنِ: خَمْسَةُ مُكَعَّبَاتٍ، بَعْضُهَا لَيْمُونِيٌّ وَبَعْضُهَا أَبْيَضُ.","sp.02":"وَالآنَ {لَوِّنْهُ|لَوِّنِيهِ} بِطَرِيقَةٍ أُخْرَى: البُرْجُ مَا زَالَ خَمْسَةً فِي كُلِّ مَرَّةٍ.","sh.01":"سِتَّةُ مُكَعَّبَاتٍ عَلَى رَفَّيْنِ. فِي كُلِّ مَرَّةٍ {اِلْمَسِ|اِلْمَسِي} الرَّفَّ الأَيْسَرَ، فَيَنْتَقِلُ مُكَعَّبٌ وَاحِدٌ إِلَى الرَّفِّ الأَيْمَنِ.","sh.02":"هَلْ بَقِيَتْ طَرِيقَةٌ؟ لَا: فَرَغَ الرَّفُّ الأَيْسَرُ. هَذِهِ كُلُّ طُرُقِ السِّتَّةِ.","mq.01":"{اُنْظُرْ|اُنْظُرِي}: هَذَا جَامِعٌ قَدِيمٌ فِي وَاحَتِنَا، وَهُوَ مَبْنِيٌّ مِنَ المُجَسَّمَاتِ!","mq.cyl":"جِسْمُ المِئْذَنَةِ طَوِيلٌ مُسْتَدِيرٌ. {اِلْمَسِ|اِلْمَسِي} الأُسْطُوَانَةَ.","mq.cyl.ok":"نَعَمْ! جِسْمُ المِئْذَنَةِ أُسْطُوَانَةٌ طَوِيلَةٌ.","mq.cone":"وَفَوْقَ المِئْذَنَةِ رَأْسٌ مُدَبَّبٌ. {اِلْمَسِ|اِلْمَسِي} المَخْرُوطَ.","mq.cone.ok":"نَعَمْ! رَأْسُ المِئْذَنَةِ مَخْرُوطٌ.","mq.cube":"وَالمَبْنَى الكَبِيرُ؟ {اِلْمَسِ|اِلْمَسِي} المُكَعَّبَ.","mq.cube.ok":"نَعَمْ! المَبْنَى يُشْبِهُ مُكَعَّبًا كَبِيرًا.","mq.02":"وَالقُبَّةُ الكَبِيرَةُ تُشْبِهُ نِصْفَ الكُرَةِ، كَأَنَّنَا قَطَعْنَا الكُرَةَ وَوَضَعْنَاهَا عَلَى السَّقْفِ.","why.solid":"يَمْلَأُ الكَفَّ، وَلَهُ سُمْكٌ.","why.drawn":"رَسْمٌ عَلَى وَرَقَةٍ: مُسَطَّحٌ.","why.flat":"رَقِيقٌ بِلَا سُمْكٍ: مُسَطَّحٌ.","ch.after":"صَارَتِ الوَرَقَةُ خَطًّا رَقِيقًا: الدَّائِرَةُ المَرْسُومَةُ مُسَطَّحَةٌ.","ch.right":"الدَّائِرَةُ المَرْسُومَةُ مُسَطَّحَةٌ: لَا تَمْلَأُ الكَفَّ.","ch.wrong":["chaos","الدَّائِرَةُ المَرْسُومَةُ كُرَةٌ."],"ms.recall8":"المُسَطَّحُ يَصِيرُ خَطًّا رَقِيقًا إِذَا أَدَرْنَاهُ، وَالمُجَسَّمُ يَبْقَى كُتْلَةً تَمْلَأُ الكَفَّ.","ms.recall5":"البُرْجُ نَفْسُهُ نُلَوِّنُهُ بِطُرُقٍ كَثِيرَةٍ: الجُزْآنِ مَعًا هُمَا العَدَدُ كُلُّهُ.","ms.ok":"رَائِعٌ! {أَتْقَنْتَ|أَتْقَنْتِ} تَفْكِيكَ العَدَدِ. {هَذِهِ نَجْمَتُكَ|هَذِهِ نَجْمَتُكِ}.","wrap.01":"فِي الوَاحَةِ الآنَ جَامِعٌ مِنَ المُجَسَّمَاتِ، وَبُرْجٌ مِنْ خَمْسَةِ طَوَابِقَ!","wrap.home":["chaos","مُهِمَّةُ البَيْتِ: {اِبْنِ|اِبْنِي} بُرْجًا مِنْ أَشْيَاءِ البَيْتِ، وَ{صَمِّمْ|صَمِّمِي} وَاحَةً مِنَ العُلَبِ وَالمُكَعَّبَاتِ، وَ{عُدَّ|عُدِّي} مَا {اسْتَعْمَلْتَ|اسْتَعْمَلْتِ}."]},"flow":[{"s":"hook","scene":"paperPush","lines":["hook.01","hook.02","hook.03"]},{"s":"explore","scene":"stampLab","mat":{"prompt":"mat.01","show":["cube"],"after":"mat.02"},"rule":"stamp.rule","rounds":[{"mk":{"solid":"cube","kind":"cube","size":130,"color":"$  برجاً من أشياء البيت، واسألوا: «ماذا {وضعتَ|وضعتِ} في الأسفل؟ ولماذا لا نضع الكرة هناك؟» ثم ضعوا خمس ملاعق في يدين: «كم في هذه؟ وكم في تلك؟»"},{"id":"m1.u2.d5","title":"نَبْنِي وَنَهْدِمُ","icon":["plus"],"concepts":{"N006":"الجمع ضمّاً والطرح إبعاداً حتى 10، ومعنى «=»","N007":"طلاقة الجمع والطرح حتى 5 (تبدأ هنا)"},"bag":{"items":[{"icon":"cubes","label":"bagCubes"}],"ask":"bag.ask","adult":"عشرة مكعبات (أو أصابع اليدين).","screenPath":"على الشاشة الضمّ والإبعاد بالمكعبات، ويُوسم «مدخل» حتى يمثّل الطفل جملة بمكعبات حقيقية أو بأصابعه."},"labels":{"bagCubes":"عَشَرَةُ مُكَعَّبَاتٍ"},"lines":{"bag.ask":"هَلْ {مَعَكَ|مَعَكِ} عَشَرَةُ مُكَعَّبَاتٍ؟ أَمْ نَلْعَبُ عَلَى الشَّاشَةِ؟","hook.01":"فَوْضَى أَخَذَتْ مُكَعَّبَيْنِ مِنَ البُرْجِ، وَاخْتَبَأَتْ بِهِمَا! كَانَ فِيهِ سَبْعَةٌ. كَمْ بَقِيَ فِيهِ؟ {تَوَقَّعْ|تَوَقَّعِي}.","hook.02":"نَتَحَقَّقُ بَعْدَ قَلِيلٍ.","mat.01":"{اِبْنِ|اِبْنِي} بُرْجًا مِنْ أَرْبَعَةِ مُكَعَّبَاتٍ، ثُمَّ {ضَعْ|ضَعِي} فَوْقَهُ ثَلَاثَةً، وَ{عُدَّهَا|عُدِّيهَا} كُلَّهَا. ثُمَّ {اِلْمَسْ|اِلْمَسِي} «تَمَّ».","mat.02":"وَالآنَ عَلَى الشَّاشَةِ.","ex.join":"الجَمْعُ ضَمٌّ: بُرْجٌ فِيهِ أَرْبَعَةٌ، وَنَضُمُّ إِلَيْهِ ثَلَاثَةً. نَعُدُّ ابْتِدَاءً مِنْ أَرْبَعَةٍ.","ex.join2":"أَرْبَعَةٌ وَثَلَاثَةٌ تَصِيرُ سَبْعَةً. وَنَكْتُبُهَا هَكَذَا، وَنَقْرَؤُهَا:","ex.rem":"الطَّرْحُ إِبْعَادٌ: بُرْجٌ فِيهِ سَبْعَةٌ، أَخَذَتْ فَوْضَى اثْنَيْنِ. نَعُدُّ البَاقِيَ.","ex.rem2":"وَنَكْتُبُهَا هَكَذَا، وَنَقْرَؤُهَا:","ex.eq":"«يُسَاوِي» تَعْنِي: مَا عَلَى الجَانِبَيْنِ مُتَسَاوٍ. نَضَعُ البُرْجَ الجَدِيدَ بِجَانِبِ بُرْجٍ مِنْ سَبْعَةٍ.","wk.01":"أَبْنِي خَمْسَةً، وَأُضِيفُ اثْنَيْنِ، وَأَعُدُّ مِنْ خَمْسَةٍ: سِتَّة، سَبْعَة.","wk.02":"وَأَكْتُبُ الجُمْلَةَ:","wk.03":"وَالآنَ بُرْجٌ فِيهِ سِتَّةٌ: أُبْعِدُ ثَلَاثَةً وَأُغَطِّيهَا. كَمْ بَقِيَ مَعَنَا؟ ثَلَاثَة.","pr.intro":"هَيَّا نَبْنِي وَنَهْدِمُ.","game.01":"وَرْشَةُ الأَبْرَاجِ: أَهْلُ الوَاحَةِ يَطْلُبُونَ أَبْرَاجًا. {أَضِفْ|أَضِيفِي} أَوْ {أَبْعِدْ|أَبْعِدِي} حَتَّى يُطَابِقَ البُرْجُ الطَّلَبَ.","fl.01":"لُعْبَةُ «أَصَابِعِي الخَمْسُ»: نَجْمَعُ وَنَطْرَحُ بِالأَصَابِعِ، بِلَا عَجَلَةٍ.","un.1":"كَانَ فِي البُرْجِ مُكَعَّبَاتٌ، أَخَذَتْ فَوْضَى ثَلَاثَةً، فَبَقِيَ أَرْبَعَةٌ. كَمْ كَانَ فِيهِ؟","ch.find":"فَوْضَى أَبْعَدَتْ مُكَعَّبَيْنِ مِنْ بُرْجٍ فِيهِ سِتَّةٌ، ثُمَّ عَلَّقَتْ عَلَيْهِ بِطَاقَةً. هَلْ هِيَ بِطَاقَتُهُ؟ {عُدَّ|عُدِّي} مَا بَقِيَ: {اِلْمَسْ|اِلْمَسِي} كُلَّ مُكَعَّبٍ.","ch.after":"عَلَّقْنَا البِطَاقَةَ الصَّحِيحَةَ: هَذَا مَا بَقِيَ مَعَنَا.","ch.right":"نَعُدُّ مَا بَقِيَ مَعَنَا: أَرْبَعَة.","ch.wrong":["chaos","البَاقِي هُوَ مَا أَخَذْتُهُ."],"ms.recall":"الجَمْعُ ضَمٌّ نَعُدُّ فِيهِ الكُلَّ، وَالطَّرْحُ إِبْعَادٌ نَعُدُّ فِيهِ مَا بَقِيَ، وَ«يُسَاوِي» تَعْنِي أَنَّ الجَانِبَيْنِ مُتَسَاوِيَانِ.","ms.ok":"رَائِعٌ! {صِرْتَ تَجْمَعُ وَتَطْرَحُ|صِرْتِ تَجْمَعِينَ وَتَطْرَحِينَ} بِالمُكَعَّبَاتِ. {هَذِهِ نَجْمَتُكَ|هَذِهِ نَجْمَتُكِ}.","wrap.01":"فِي الوَاحَةِ الآنَ جِسْرٌ مِنَ الأَبْرَاجِ، وَعَلَيْهِ جُمْلَةٌ عَدَدِيَّةٌ!","wrap.02":"وَمِنَ الغَدِ، فِي مُرَاجَعَةِ اليَوْمِ: قِصَصُ الوَاحَةِ، وَلُعْبَةُ أَصَابِعِي الخَمْسِ.","wrap.home":["chaos","مُهِمَّةُ البَيْتِ: عَلَى المَائِدَةِ {عُدَّ|عُدِّي} الأَطْبَاقَ، ثُمَّ {أَضِفْ|أَضِيفِي} طَبَقَيْنِ لِلضُّيُوفِ: كَمْ صَارَتْ؟"]},"flow":[{"s":"hook","scene":"takeHook","a":7,"b":2,"lines":["hook.01","hook.02"]},{"s":"explore","scene":"items","mode":"explore","mat":{"prompt":"mat.01","icon":true,"show":[],"after":"mat.02"},"intro":"ex.join","items":[{"t":"join","a":4,"b":3}]},{"s":"explore","scene":"steps","auto":true,"h":220,"steps":[[{"say":"ex.join2"},{"sentence":[4,"+",3,7],"at":[180,110]}]]},{"s":"explore","scene":"items","mode":"explore","intro":"ex.rem","items":[{"t":"remove","a":7,"b":2}]},{"s":"explore","scene":"steps","auto":true,"h":220,"steps":[[{"say":"ex.rem2"},{"sentence":[7,"-",2,5],"at":[180,110]}]]},{"s":"explore","scene":"items","mode":"explore","intro":"ex.eq","items":[{"t":"eqPair","n":7,"parts":[4,3]}]},{"s":"worked","scene":"steps","steps":[[{"towers":[[5,220,"lemon"]],"base":250} async function runLesson(id, opt = {}) {
  if (TAB_LOST) { showTabLost(); return; }
  const L = LDATA[id]; CUR = L; FLOW++; colorIx = 0; streak = 0; const P = progOf(id);
  const resumeAt = opt.resume && P.resume ? Math.min(P.resume.stage, L.flow.length - 1) : 0;
  if (!opt.resume) { P.runs = (P.runs || 0) + 1; }
  reseed((KID || 'k0') + '|' + id + '|' + (P.runs || 1) + (opt.resume ? '|r' + resumeAt : '')); saveProg();
  show('lesson'); lockGo(); setSteps(L.flow.length); SCENE_NOW = 'bag'; window.__scene = id + ':bag';
  if (!opt.resume) await bagStage(L);
  for (let i = resumeAt; i < L.flow.length; i++) {
    const st = L.flow[i]; setStep(i); SCENE_NOW = st.s + (st.scene ? ':' + st.scene : ''); window.__scene = id + ':' + SCENE_NOW;
    P.resume = { stage: i, t: Date.now() }; saveProg();
    await runStage(L, st);
    if (st.s === 'test' && !P.mastered) { await nextBtn(); await facesAsk(L); break; }   // لم يبلغ العتبة: نشاط علاجي ومراجعة الدرس الأضعف، بلا ختام الشارة
    if (i < L.flow.length - 1 && st.s !== 'wrap') await nextBtn(labelText(L.flow[i + 1].s === 'practice' ? 'tryYou' : i === 0 ? 'letsGo' : 'next'));
  }
  setStep(L.flow.length);
  P.done = true; P.at = Date.now(); delete P.resume; if (P.path === 'screen' && !(L.bag && L.bag.screenOnly)) P.entry = true; else if (P.path === 'mat') P.entry = false;
  if (L.review && L.review.length) srsStart(id);
  if (PROG.review === id && P.done) delete PROG.review;
  saveProg(); countLesson();
  await nextBtn(labelText('toMap')); showHome();
}
async function runStage(L, st) {
  if (st.mat) await SCENES.material(st.mat);                              // مسار «معي»: الأشياء الحقيقية قبل الشاشة (D238)
  if (st.scene) { const f = SCENES[st.scene]; if (!f) throw new Error('مشهد غير معروف: ' + st.scene); await f(st, L); return; }
  if (st.s === 'practice') return practiceStage(L, st);
  if (st.s === 'chaos') return chaosStage(L.chaos);
  if (st.s === 'mastery') return masteryStage(L);
  if (st.s === 'test') return testStage(L);
  if (st.s === 'wrap') return wrapStage(L);
  if (st.items) return SCENES.items(st);
  throw new Error('مرحلة بلا مشهد: ' + st.s);
}

/* فحص الإتقان (D240، D233): لكل مفهوم بنوده من مولّد غير مولّد التمرين، من المحاولة الأولى بلا مساعدة.
   العتبة 3 من 3 أو 4 من 5، ودورتان على الأكثر: بينهما تذكّر وبنود علاجية بمساعدة، ثم تأجيل معلَّم إلى المراجعة.
   «المدخل» (entryOnly) يُعرض ولا يُتقَن على الشاشة (C008: يحكم الكبير ببطاقته) */
const msNeed = n => n >= 5 ? n - 1 : n;

    const cs = P.cs[C] = isObj(P.cs[C]) ? P.cs[C] : {}; const entry = (M.entryOnly || []).includes(C);
    let passed = false, ok = 0, round = 0;
    for (round = 1; round <= 2; round++) {
      ok = 0; for (const it of items) { const r = await runItem(it, 'mastery', { scene: 'mastery:' + C }); if (r.firstTry) ok++; }
      if (ok >= msNeed(items.length)) { passed = true; break; }
      if (round === 1) { await S('gen.ms.again');
        if (M.recall && M.recall[C]) await SCENES.steps(M.recall[C]);
        for (const it of (M.remedial && M.remedial[C]) || []) await runItem(it, 'remedial', { scene: 'remedial:' + C });
        await S('gen.ms.round2'); }
    }

  const real = Object.keys(M.concepts).filter(C => !(M.entryOnly || []).includes(C));
  P.mastered = real.every(C => P.cs[C].mastered); P.deferred = real.some(C => P.cs[C].deferred && !P.cs[C].mastered); saveProg();
  if (P.mastered) { SFX.win(); starBurst(); await S(M.ok || 'gen.ms.ok'); }
}

/* اختبار الوحدة (المبدأ 3: العتبة 85%، فالمطلوب ceil(0.85 × عدد البنود)): من المحاولة الأولى بلا مساعدة، ولا درجة تُقال للطفل (D233) */
const testNeed = n => Math.ceil(n * 0.85);
async function testStage(L) {

  if (ok >= testNeed(order.length)) { P.mastered = true; PROG['badge:' + L.unit] = true; saveProg(); await stoneScene(L); return; }

      return `<tr><td>${esc(plain(L.title))}</td><td>${DG(Math.min(r.step, 4))} من ${DG(4)}</td><td>${r.due == null ? '<span class="pill good">ثابت</span>' : d <= 0 ? '<span class="pill think">اليوم</span>' : 'بعد ' + nw(d, 'يوم واحد', 'يومين', 'أيام', 'يوماً')}</td></tr>`; }).join('')}</tbody></table>` : '<p>تبدأ بعد أول درس.</p>'}
      ${Object.entries(PROG.streams).filter(([, s]) => s.n).map(([k, s]) => `<p>${{ glance: 'اللمحة السريعة', fluency: 'أصابعي الخمس', story: 'قصص الواحة' }[k] || k}: ${DG(s.ok || 0)} من ${DG(s.n)} من المحاولة الأولى</p>`).join('')}</details>
    <div class="card"><b>إشارات</b> (من آخر المحاولات):<br>${signals().map(([t, x]) => `<span class="pill think">${t}</span> ${esc(x)}`).join('<br>') || 'لا شيء يدعو للقلق.'}
      ${faces.length ? `<p class="muted">«كيف كان؟»: ${esc(faces.join(' · '))}</p>` : ''}
      <div class="seg"><button class="pick" id="repBtn">تقرير الأسبوع للطباعة</button></div></div>
    <details class="card"><summary><b>الأخطاء الشائعة التي ظهرت</b></summary>${Object.keys(errs).length ? Object.entries(errs).sort((a, b) => b[1] - a[1]).map(([k, n]) => `${esc(ERRN[k])}: ${DG(n)}`).join('<br>') : 'لا شيء بعد'}</details>
    <div class="card"><b>حدّ الجلسة:</b> عدد الدروس قبل أن يقترح فرجار استراحة («مراجعة اليوم» لا تُحسب).
      <div class="seg" id="segMax">${[1, 2, 3, 0].map(n => `<button class="pick" data-n="${n}" aria-pressed="${SET.sessionMax === n}">${n ? nw(n, 'درس واحد', 'درسان', 'دروس', 'درساً') : 'بلا حدّ'}</button>`).join('')}</div>
      <p class="muted">في هذه الجلسة: ${nw(sessionNow().n, 'درس واحد', 'درسان', 'دروس', 'درساً')}.</p>
      <div class="seg"><button class="pick" id="slowBtn" aria-pressed="${!!SET.slow}">قراءة أبطأ: ${SET.slow ? 'تعمل' : 'متوقفة'}</button></div></div>
    <div class="card"><b>أطفال هذا الجهاز</b> (لكل طفل تقدّمه ومعرضه وإعداداته، ويختار صورته عند الدخول):
      <div class="seg">${KIDS.map(k => `<span class="pill${k.id === KID ? ' good' : ''}">${esc(k.name || 'بلا اسم')}</span>${k.id === KID ? '' : `<button class="pick" data-del="${k.id}">حذف ${esc(k.name || 'الطفل')}</button>`}`).join(' ')}<button class="pick" id="addKid">إضافة طفل</button><button class="pick" id="editProfile">تعديل الاسم والصورة</button></div></div>
    <details class="card"><summary><b>للتجربة والدعم</b></summary>
      <p>أصوات مسجّلة: ملفات صوتية اسم كل منها معرّف الجملة، مثل <code>m1.u1.d2.hook.01.mp3</code> أو <code>…_f.mp3</code> للصيغة المؤنثة.</p><input type="file" id="clipIn" accept="audio/*" multiple><p id="clipMsg" class="muted"></p>
      <div class="seg"><button class="pick" id="unlockAll">${PROG.unlockAll ? 'إعادة قفل الدروس' : 'فتح كل الدروس للتجربة'}</button><button class="pick" id="resetAll">بدء كل الدروس من جديد</button></div>
      ${LOG.errors.length ? `<p><b>سجلّ الأعطال</b> (يُرسل عند البلاغ):</p><pre class="errlog" dir="ltr">${esc(LOG.errors.slice(-8).map(e => new Date(e.t).toISOString().slice(0, 16) + ' ' + e.scene + '\n' + e.msg.split('\n').slice(0, 3).join('\n')).join('\n\n'))}</pre>` : ''}</details>
    <div class="row"><button class="go" id="closePanel">رجوع</button></div></div>`;
  $('#panel').hidden = false; $('#panel').scrollTop = 0;
  $('#closePanel').onclick = () => { $('#panel').hidden = true; showHome(); };
  $('#editProfile').onclick = () => { $('#panel').hidden = true; openProfile(false); };
  $('#addKid').onclick = () => { $('#panel').hidden = true; openProfile(true); };
  $('#panel').querySelectorAll('[data-del]').forEach(b => b.onclick = () => { if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = 'متأكد؟ يُحذف تقدّمه كله'; return; }
    const id = b.dataset.del; for (const key of ['hp_prog', 'hp_log', 'hp_session', 'hp_settings', 'hp_designs']) store.del(key + ':' + id);
    KIDS.splice(KIDS.findIndex(k => k.id === id), 1); store.set('hp_kids', KIDS); openPanel(); });
  $('#panel').querySelectorAll('[data-ac]').forEach(b => b.onclick = () => { PROG.adult = isObj(PROG.adult) ? PROG.adult : {}; const a = PROG.adult[b.dataset.ac] = PROG.adult[b.dataset.ac] || [];
    a[+b.dataset.i] = b.dataset.v === '1'; const L = LDATA[b.dataset.ac]; const C = L.adultCard.concept;
    if (C && a.length === L.adultCard.qs.length && a.every(Boolean)) { const cs = progOf(L.id).cs = progOf(L.id).cs || {}; cs[C] = { ...(cs[C] || {}), mastered: true, byAdult: true }; }
    saveProg(); openPanel(); });
  $('#repBtn').onclick = () => weeklyReport();
  $('#slowBtn').onclick = () => { SET.slow = !SET.slow; saveSet(); openPanel(); };
  $('#segMax').querySelectorAll('.pick').forEach(b => b.onclick = () => { SET.sessionMax = +b.dataset.n; saveSet(); openPanel(); });
  $('#unlockAll').onclick = () => { if (PROG.unlockAll) delete PROG.unlockAll; else PROG.unlockAll = true; saveProg(); $('#panel').hidden = true; showHome(); };
  $('#resetAll').onclick = () => { if ($('#resetAll').dataset.sure !== '1') { $('#resetAll').dataset.sure = '1'; $('#resetAll').textContent = 'متأكد؟ يُمحى التقدّم كله لهذا الطفل'; return; }
    for (const k of Object.keys(PROG)) delete PROG[k]; PROG.schema = SCHEMA; PROG.srs = {}; PROG.ws = {}; PROG.streams = {}; SESSION = { n: 0, t: 0 }; store.set(kk('hp_session'), SESSION); saveProg(); LOG.attempts = []; LOG.faces = []; store.set(kk('hp_log'), LOG); store.set(designsKey(), []); IDB.clear(); $('#panel').hidden = true; showHome(); };
  $('#clipIn').onchange = e => { let n = 0; for (const f of e.target.files) { CLIPS[f.name.replace(/\.(mp3|m4a|wav|ogg)$/i, '')] = URL.createObjectURL(f); n++; } $('#clipMsg').textContent = 'أُضيف ' + DG(n) + ' ملفاً.'; };
}
$('#adultBtn').onclick = () => { stopVoice(); adultGate(openPanel, () => {}); };            // الزرّ في الخريطة وحدها، فلا يقطع درساً
/* البداية */
defs(); renderMute(); tabClaim();
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { defs(); if (!$('#home').hidden) showHome(); }); } catch (e) {}
if (!PROFILE) firstRun(); else if (KIDS.length > 1) { showHome(); openKids(true); } else showHome();
</script>
</body>
</html>
