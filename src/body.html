  <div class="hello"><button class="round" id="meBtn" aria-label="ملفّي وأطفال الجهاز"></button><b id="helloName"></b><button class="round ico" id="galBtn" aria-label="معرضي وصيد الأشكال بالكاميرا"></button><button class="round ico digits" id="digBtn" aria-label="أرقامي" hidden></button><button class="round ico" id="muteBtn" aria-label="كتم الصوت أو تشغيله"></button></div>
