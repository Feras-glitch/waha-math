<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>واحة الرياضيات</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- الخط: يُضمَّن ملف Baloo Bhaijaan 2 (OFL) في خطوة البناء عند توفّره (D232)؛ حتى ذلك الحين رابط غير حاجب وبدائل نظام عربية -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap" media="print" onload="this.media='all'">
<style>
/* التصميم: مدينة من ورق مقصوص. الأشكال قصاصات بحافة بيضاء وظل ورقي، وأفق الواحة يكبر مع كل درس.
   شاشة واحدة بلا تمرير: شريط المراحل ← الشخصية وفقاعتها ← نافذة على المدينة (المسرح) ← زر واحد بارز */
:root {
  --sky-top: #bfe3ee; --sky-bot: #eef8f5;      /* سماء المدينة */
  --ground: #cfe6c9;
  --paper: #fffdf8;                            /* ورق القصاصات */
  --ink: #1b3440; --muted: #5a7480; --line: #cfe0e0;
  --circle: #ee7a5f; --square: #2a9d8f; --triangle: #8e6bbf; --rect: #f2b33d;   /* ألوان الهوية الثابتة */
  --compass: #1f5f99; --compass-dk: #154674; --chaos: #d9483b;
  --good: #2e8a4e; --think: #c27c16;
  --basket: #c98f55; --basket-dk: #9c6837;
  --shadow: 0 5px 0 rgba(27, 52, 64, .10), 0 10px 22px rgba(27, 52, 64, .10);
  --f: "Baloo Bhaijaan 2", "Noto Naskh Arabic", "Noto Sans Arabic", "Geeza Pro", "Segoe UI", Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --sky-top: #183747; --sky-bot: #10232c; --ground: #1f3a2f; --paper: #1d313b; --ink: #ecf4f2; --muted: #a2bcc2; --line: #2d4a55;
  --compass: #4b8fd1; --compass-dk: #2c6aa6; --good: #63c98a; --think: #f0b45a; --shadow: 0 5px 0 rgba(0,0,0,.25), 0 10px 22px rgba(0,0,0,.3); color-scheme: dark } }
:root[data-theme="dark"] {
  --sky-top: #183747; --sky-bot: #10232c; --ground: #1f3a2f; --paper: #1d313b; --ink: #ecf4f2; --muted: #a2bcc2; --line: #2d4a55;
  --compass: #4b8fd1; --compass-dk: #2c6aa6; --good: #63c98a; --think: #f0b45a; --shadow: 0 5px 0 rgba(0,0,0,.25), 0 10px 22px rgba(0,0,0,.3); color-scheme: dark }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: linear-gradient(180deg, var(--sky-top), var(--sky-bot) 60%); background-color: var(--sky-bot); color: var(--ink);
  font-family: var(--f); font-size: 20px; line-height: 1.6; -webkit-tap-highlight-color: transparent; overflow: hidden; }
button { font-family: inherit; color: inherit; }
button:focus-visible, [tabindex]:focus-visible { outline: 4px solid var(--compass); outline-offset: 3px; }
.cityfloor { position: fixed; inset: auto 0 0 0; height: 22vh; z-index: 0; pointer-events: none; opacity: .55; }
.cityfloor svg { width: 100%; height: 100%; display: block; }
.screen { position: relative; z-index: 1; height: 100%; box-sizing: border-box; max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; }

/* أزرار بارزة كأزرار لعبة */
.go { min-height: 64px; border: 0; border-radius: 22px; background: var(--compass); color: #fff; font-size: 24px; font-weight: 800; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 6px 0 var(--compass-dk); transition: transform .08s, box-shadow .08s, opacity .2s; }
.go:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--compass-dk); }
.go[disabled] { opacity: .35; cursor: default; transform: none; }
.go svg { width: 26px; height: 26px; }
.round { width: 46px; height: 46px; border-radius: 50%; border: 0; background: var(--paper); box-shadow: 0 4px 0 var(--line); display: grid; place-items: center; cursor: pointer; padding: 0; flex: none; overflow: hidden; }
.round svg, .round img { width: 100%; height: 100%; object-fit: cover; display: block; }
.round.ico svg { width: 24px; height: 24px; }
.round.digits { font-size: 15px; font-weight: 800; color: var(--compass); width: auto; min-width: 46px; padding: 0 8px; border-radius: 23px; }

/* ===== خريطة الوحدة ===== */
#home { display: grid; grid-template-rows: auto auto 1fr; gap: 10px; }
.hello { display: flex; align-items: center; gap: 10px; }
.hello b { font-size: 22px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.banner { border-radius: 26px; overflow: hidden; box-shadow: var(--shadow); background: var(--paper); }
.banner svg { width: 100%; height: auto; display: block; }
.banner h1 { margin: 0; padding: 4px 16px 10px; font-size: 30px; line-height: 1.3; text-wrap: balance; }
.banner p { margin: -6px 16px 12px; color: var(--muted); font-size: 16px; }
.path { display: grid; gap: 10px; align-content: start; overflow: auto; padding: 4px 2px 16px; min-height: 0; }
.stop { display: grid; grid-template-columns: 72px 1fr 34px; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 22px; border: 0;
  background: var(--paper); box-shadow: var(--shadow); cursor: pointer; text-align: right; font-size: 20px; font-weight: 800; }
.stop:nth-child(even) { margin-inline-start: 26px; } .stop:nth-child(odd) { margin-inline-end: 26px; }
.stop svg { width: 72px; height: 56px; }
.stop small { display: block; font-size: 14px; font-weight: 700; color: var(--muted); }
.stop[aria-disabled="true"] { opacity: .45; cursor: default; }
.stop.now { outline: 4px solid var(--compass); animation: glow 1.6s ease-in-out infinite; }
@keyframes glow { 50% { outline-color: rgba(43, 108, 176, .35); outline-color: color-mix(in srgb, var(--compass) 35%, transparent); } }
.stop .st { width: 34px; height: 34px; }

/* ===== الدرس ===== */
#lesson { display: grid; grid-template-rows: auto auto auto auto; align-content: center; gap: 12px; }
.top { display: flex; align-items: center; gap: 8px; }
.steps { flex: 1; display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: center; }
.steps i { height: 12px; border-radius: 12px; background: var(--line); background: color-mix(in srgb, var(--paper) 70%, var(--line)); box-shadow: inset 0 2px 0 rgba(0,0,0,.06); transition: background .4s; }
.steps i.done { background: var(--square); } .steps i.now { background: var(--rect); }
.talk { display: grid; grid-template-columns: 84px 1fr; gap: 8px; align-items: end; min-height: 96px; }
.who { width: 84px; height: 96px; }
.who svg { width: 100%; height: 100%; overflow: visible; }
.speaking .who svg { animation: bob .45s ease-in-out infinite alternate; transform-origin: 50% 100%; }
@keyframes bob { to { transform: translateY(-5px) rotate(-3deg); } }
.blink { animation: blink 4.2s infinite; transform-box: fill-box; transform-origin: center; }
@keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
.bubble { position: relative; background: var(--paper); border-radius: 24px 24px 8px 24px; padding: 10px 16px 10px 50px; box-shadow: var(--shadow);
  font-size: 21px; font-weight: 700; line-height: 1.75; min-height: 56px; display: flex; align-items: center; text-wrap: balance; margin-bottom: 8px; }
.bubble.chaos { color: var(--chaos); }
.replay { position: absolute; left: 4px; top: 50%; transform: translateY(-50%); width: 46px; height: 46px; border-radius: 50%; border: 0; background: var(--sky-bot); cursor: pointer; display: grid; place-items: center; }
.replay svg { width: 20px; height: 20px; }
.stage { position: relative; border-radius: 30px; box-shadow: var(--shadow); overflow: hidden; display: grid; background: var(--paper); }
.stage > svg { width: 100%; height: auto; max-height: 60vh; display: block; touch-action: none; user-select: none; }
.bins { position: absolute; inset: auto 8px 8px 8px; display: grid; grid-template-columns: repeat(var(--n, 3), 1fr); gap: 6px; }
.bin { border: 0; background: none; padding: 0; cursor: pointer; display: grid; justify-items: center; font-size: 17px; font-weight: 800; color: var(--ink); }
.bin svg { width: 100%; max-width: 110px; height: auto; filter: drop-shadow(0 4px 0 rgba(0,0,0,.12)); transition: transform .15s; }
.bin.hot svg, .bin:active svg { transform: translateY(-4px) scale(1.04); }
.bin.ok svg { filter: drop-shadow(0 0 0 transparent) drop-shadow(0 0 8px var(--good)); }
.bin.no { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.choices { position: relative; display: grid; gap: 8px; padding: 0 10px 10px; }
.pick { border: 0; background: var(--sky-bot); box-shadow: 0 4px 0 var(--line); border-radius: 18px; padding: 10px 14px; font-size: 19px; font-weight: 700; text-align: right; cursor: pointer; min-height: 60px; }
.choices.icons { grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); }
.choices.icons .pick { display: grid; justify-items: center; gap: 2px; text-align: center; color: var(--compass); font-size: 18px; }
.choices.icons .pick span { color: var(--ink); }
.bins.shelf { inset: auto 8px 8px 8px; background: rgba(160, 110, 60, .3); background: color-mix(in srgb, var(--basket) 30%, transparent); border-radius: 16px; padding: 6px 4px 2px; }
.bins.shelf .bin svg { max-width: 92px; }
.unithead { display: flex; align-items: center; gap: 10px; margin: 8px 4px 0; font-size: 19px; font-weight: 800; }
.unithead small { display: block; font-size: 13px; color: var(--muted); font-weight: 700; }
.unithead .ub { width: 34px; height: 34px; flex: none; }
.unithead.locked { opacity: .5; }
.unithead .hosts { width: 96px; height: 44px; flex: none; }
.unithead .hosts svg { width: 100%; height: 100%; overflow: visible; }
.stop.review { background: var(--paper); background: color-mix(in srgb, var(--rect) 22%, var(--paper)); }
.stop.review .st { width: 34px; height: 34px; }
.breakbox { display: grid; gap: 14px; width: min(420px, 100%); justify-items: center; }
.breakbox .who { width: 120px; height: 134px; }
.breakbox p { font-size: 22px; font-weight: 700; margin: 0; text-wrap: balance; }
.breakbox .go { width: 100%; }
.breakbox .more { background: none; border: 0; color: var(--muted); font-size: 15px; text-decoration: underline; cursor: pointer; min-height: 44px; }
.gate { max-width: 420px !important; text-align: center; }
.gate .gq { font-size: 34px; font-weight: 800; margin: 0; direction: ltr; }
.gate input { font: inherit; font-size: 28px; font-weight: 800; text-align: center; width: 100%; box-sizing: border-box; padding: 8px 12px; border-radius: 16px; border: 3px solid var(--line); background: var(--paper); color: var(--ink); }
.gate input:focus { outline: none; border-color: var(--compass); }
.seg { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.seg .pick { min-height: 44px; padding: 6px 14px; font-size: 16px; }
.seg .pick[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--compass), 0 4px 0 var(--line); }
.talkcard { border-inline-start: 4px solid var(--square); padding-inline-start: 10px; margin: 8px 0; }
.kids { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; width: 100%; }
.kid { border: 0; border-radius: 22px; background: var(--paper); box-shadow: 0 6px 0 var(--line); padding: 12px 8px; display: grid; justify-items: center; gap: 6px; font-size: 21px; font-weight: 800; cursor: pointer; min-height: 120px; }
.kid .round { width: 76px; height: 76px; }
.kid[aria-pressed="true"] { box-shadow: 0 0 0 4px var(--compass), 0 6px 0 var(--compass-dk); }
.gallery { width: min(560px, 100%); display: grid; gap: 12px; align-self: start; text-align: right; }
.gallery .ghead { display: flex; align-items: center; gap: 10px; font-size: 24px; }
.gallery .talk { grid-template-columns: 70px 1fr; min-height: 0; } .gallery .who { width: 70px; height: 80px; } .gallery .bubble { padding: 10px 16px; }
.huntgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.gitems { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.gitems figure { margin: 0; background: var(--paper); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; text-align: center; font-weight: 700; font-size: 16px; }
.gitems img, .gitems svg { width: 100%; height: 120px; object-fit: cover; display: block; }
.wsbar { position: absolute; top: 8px; inset-inline-start: 8px; display: flex; gap: 6px; }
.wsbar .pick { min-height: 48px; padding: 6px 14px; font-size: 18px; }
.wssel { filter: drop-shadow(0 0 6px var(--compass)) drop-shadow(0 0 2px var(--compass)); }
.stop.ws { background: var(--paper); background: color-mix(in srgb, var(--square) 14%, var(--paper)); }
@media print { body { overflow: visible !important; background: #fff !important; } body > *:not(#panel) { display: none !important; }
  #panel { position: static !important; overflow: visible !important; background: #fff !important; } .noprint { display: none !important; } .panel .card { box-shadow: none; border: 1px solid #ccc; } }
.pick.reading { box-shadow: 0 0 0 3px var(--compass), 0 4px 0 var(--line); }
.pick.ok { box-shadow: 0 0 0 3px var(--good), 0 4px 0 var(--line); } .pick.no { box-shadow: 0 0 0 3px var(--think), 0 4px 0 var(--line); }
.bar { display: flex; gap: 10px; }
.bar .go { flex: 1; }
.help { width: 72px; border: 0; border-radius: 22px; background: var(--paper); box-shadow: 0 6px 0 var(--line); cursor: pointer; display: grid; place-items: center; padding: 4px; }
.help svg { width: 52px; height: 60px; }

/* ===== شاشات الغلاف والملف ===== */
.cover { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; overflow: auto; text-align: center; background: linear-gradient(180deg, var(--sky-top), var(--sky-bot)); background-color: var(--sky-bot);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px; }
.profile { display: grid; gap: 14px; width: min(420px, 100%); }
.profile h1 { font-size: 30px; margin: 0; line-height: 1.3; text-wrap: balance; }
.profile input[type=text] { font: inherit; font-size: 24px; font-weight: 700; text-align: center; padding: 10px 14px; border-radius: 18px; border: 3px solid var(--line); background: var(--paper); color: var(--ink); width: 100%; box-sizing: border-box; }
.profile input[type=text]:focus { outline: none; border-color: var(--compass); }
.gender { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.gender button { border: 0; border-radius: 22px; background: var(--paper); box-shadow: 0 6px 0 var(--line); padding: 10px 6px 6px; cursor: pointer; font-size: 22px; font-weight: 800; display: grid; justify-items: center; gap: 2px; min-height: 120px; }
.gender button svg { width: 76px; height: 76px; }
.gender button[aria-pressed="true"] { box-shadow: 0 0 0 4px var(--compass), 0 6px 0 var(--compass-dk); }
.photo-row { display: flex; align-items: center; justify-content: center; gap: 12px; }
.photo-row .round { width: 64px; height: 64px; }
.photo-btn { border: 2px dashed var(--muted); border-radius: 16px; padding: 10px 14px; cursor: pointer; font-size: 18px; font-weight: 700; background: var(--paper); }
.adult-link { position: fixed; left: max(12px, env(safe-area-inset-left, 0px)); bottom: calc(6px + env(safe-area-inset-bottom, 0px)); font-size: 13px; color: var(--muted); background: none; border: 0; cursor: pointer; text-decoration: underline; z-index: 30; }
.panel { position: fixed; inset: 0; z-index: 40; background: var(--sky-bot); overflow: auto; font-size: 16px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px; }
.panel .wrap { max-width: 640px; margin: 0 auto; display: grid; gap: 14px; }
.panel h2 { margin: 0; font-size: 24px; }
.panel .card { background: var(--paper); border-radius: 18px; padding: 12px 14px; box-shadow: var(--shadow); min-width: 0; overflow-x: auto; }
.panel table { border-collapse: collapse; width: 100%; font-size: 14px; }
.panel td, .panel th { border-bottom: 1px solid var(--line); padding: 6px 4px; text-align: right; vertical-align: top; }
.pill { display: inline-block; padding: 1px 10px; border-radius: 99px; font-size: 13px; font-weight: 700; background: var(--sky-bot); }
.pill.good { color: var(--good); } .pill.think { color: var(--think); }

/* احتفال: قصاصات من الأشكال نفسها */
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 50; overflow: hidden; }
.confetti i { position: absolute; top: -30px; width: 16px; height: 16px; animation: fall 1.7s cubic-bezier(.3,.6,.5,1) forwards; }
@keyframes fall { to { transform: translate(var(--dx), 110vh) rotate(var(--r)); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } .confetti { display: none; } }
@media (max-height: 660px) { .bubble { font-size: 18px; } .talk { min-height: 80px; } .who { height: 80px; } .go { min-height: 56px; } }
</style>
</head>
<body>

<!-- ملف الطالب -->
<div class="cover" id="profileCover" hidden>
  <form class="profile" id="profileForm" autocomplete="off">
    <h1>أَهْلًا وَسَهْلًا فِي هَنْدَسُوبُولِيس!</h1>
    <label for="pName" style="font-size:20px;font-weight:700">الاسْمُ</label>
    <input type="text" id="pName" maxlength="24" placeholder="الاسم">
    <div class="gender" role="group" aria-label="ولد أو بنت"><button type="button" id="gM" aria-pressed="false"></button><button type="button" id="gF" aria-pressed="false"></button></div>
    <div class="photo-row"><span class="round" id="photoPrev"></span><label class="photo-btn" for="pPhoto">صُورَتِي (اختياري)</label><input type="file" id="pPhoto" accept="image/*" hidden></div>
    <p id="pMsg" style="color:var(--think);min-height:1.6em;margin:0"></p>
    <button class="go" type="submit" id="pSave">تَمَّ</button>
  </form>
</div>

<!-- خريطة الوحدة -->
<main class="screen" id="home" hidden>
  <div class="hello"><button class="round" id="meBtn" aria-label="ملفّي"></button><b id="helloName"></b><button class="round ico" id="galBtn" aria-label="معرضي وصيد الأشكال بالكاميرا"></button><button class="round ico digits" id="digBtn" aria-label="الأرقام: شرقية أو غربية"></button><button class="round ico" id="muteBtn" aria-label="كتم الصوت أو تشغيله"></button></div>
  <div class="banner"><div id="cityBanner"></div><h1>هَنْدَسُوبُولِيس</h1><p>المرحلة الأولى: البذور</p></div>
  <nav class="path" id="path" aria-label="دروس الوحدة"></nav>
</main>

<!-- الدرس -->
<section class="screen" id="lesson" hidden>
  <div class="top"><button class="round ico" id="mapBtn" aria-label="خريطة الوحدة"></button><div class="steps" id="steps"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><button class="round ico" id="muteBtn2" aria-label="كتم الصوت أو تشغيله"></button></div>
  <div class="talk" id="talk"><div class="who" id="who"></div><div class="bubble" id="bubble"><span id="say" aria-live="polite"></span><button class="replay" id="replay" aria-label="أعد الجملة"></button></div></div>
  <div class="stage" id="stage"></div>
  <div class="bar"><button class="help" id="helpBtn" aria-label="هل نفكّر معاً؟" hidden></button><button class="go" id="go" disabled></button></div>
</section>

<button class="adult-link" id="adultBtn">للكبار</button>
<div class="panel" id="panel" hidden></div>
<div class="cover" id="breakCover" hidden></div>
<div class="cover" id="kidsCover" hidden></div>
<div class="cover" id="galCover" hidden></div>
<div class="cityfloor" id="cityfloor" aria-hidden="true"></div>
<div class="confetti" id="confetti" aria-hidden="true"></div>
<svg id="gdefs" width="0" height="0" style="position:absolute;width:0;height:0" aria-hidden="true" focusable="false"></svg>

ٌ. المُثَلَّثُ مُغْلَقٌ."}},"fourCorners":{"label":"يخلط المربع بالمثلث","explain":{"gen.err.fourCorners.01":"لِنُفَكِّرْ مَعًا: كَمْ رَأْسًا لَهُ؟ أَرْبَعَةٌ، فَلَيْسَ مُثَلَّثًا."}},"squareAsRect":{"label":"يسمّي المربع مستطيلاً","explain":{"gen.err.squareAsRect.01":"لِنُفَكِّرْ مَعًا: أَضْلَاعُهُ الأَرْبَعَةُ كُلُّهَا بِالطُّولِ نَفْسِهِ. هَذَا نُسَمِّيهِ مُرَبَّعًا."}},"rectAsSquare":{"label":"يسمّي المستطيل مربعاً","explain":{"gen.err.rectAsSquare.01":"لِنُفَكِّرْ مَعًا: ضِلْعَانِ أَطْوَلُ مِنَ الآخَرَيْنِ، فَلَيْسَ مُرَبَّعًا."}},"rotatedRect":{"label":"يرفض المستطيل المدوَّر","explain":{"gen.err.rotatedRect.01":"لِنُفَكِّرْ مَعًا: دَوَّرْنَاهُ فَقَطْ. مَا زَالَ لَهُ ضِلْعَانِ طَوِيلَانِ وَضِلْعَانِ قَصِيرَانِ."}},"standingRect":{"label":"يرفض المستطيل الواقف","explain":{"gen.err.standingRect.01":"لِنُفَكِّرْ مَعًا: المُسْتَطِيلُ الوَاقِفُ مِثْلُ البَابِ: ضِلْعَانِ طَوِيلَانِ وَضِلْعَانِ قَصِيرَانِ."}},"equalSides":{"label":"لم يقارن الأضلاع","explain":{"gen.err.equalSides.01":"لِنُفَكِّرْ مَعًا: هَلْ أَضْلَاعُهُ الأَرْبَعَةُ مُتَسَاوِيَةٌ؟"}},"rotated":{"label":"يتأثر بتدوير الشكل","explain":{"gen.err.rotated.01":"لِنُفَكِّرْ مَعًا: هُوَ مُدَوَّرٌ فَقَطْ. هَيَّا نَعُدُّ أَضْلَاعَهُ وَنُقَارِنُهَا."}},"byShape":{"label":"يصنّف بالاسم لا بالشكل","explain":{"gen.err.byShape.01":"لِنُفَكِّرْ مَعًا: لَا نَنْظُرُ إِلَى اسْمِ الشَّيْءِ؛ نَنْظُرُ إِلَى حَوَافِّهِ وَرُؤُوسِهِ."}},"slot":{"label":"تركيب: قطعة في غير مكانها"},"generic":{"label":"خطأ عام","explain":{"gen.err.generic.01":"لِنُفَكِّرْ مَعًا: كَمْ رَأْسًا لَهُ؟ وَهَلْ حَوَافُّهُ مُسْتَقِيمَةٌ؟","gen.err.generic.02":"لِنُفَكِّرْ مَعًا: كَمْ ضِلْعًا لَهُ؟ وَهَلْ أَضْلَاعُهُ مُسْتَقِيمَةٌ؟","gen.err.generic.03":"لِنُفَكِّرْ مَعًا: كَمْ ضِلْعًا لَهُ؟ وَهَلْ فِيهَا طَوِيلٌ وَقَصِيرٌ؟","gen.err.generic.04":"لِنُفَكِّرْ مَعًا: هَلْ يَتَدَحْرَجُ؟ وَهَلْ لَهُ وُجُوهٌ مُسَطَّحَةٌ؟"}},"flatAsCube":{"label":"يسمّي المربع الورقي مكعباً","explain":{"gen.err.flatAsCube.01":"لِنُفَكِّرْ مَعًا: هَذَا مُرَبَّعٌ مِنْ وَرَقٍ،     <div class="card"><b>بطاقات الحوار ومهام البيت</b> (بعد كل درس أُنجز، D198):${LESSONS.filter(L => (PROG[L.id] || {}).done && TALK[L.id]).map(L => `<div class="talkcard"><b>${plain(L.title)}</b><br>${esc(G(TALK[L.id]))}${homeTask(L) ? `<br><span style="color:var(--muted)">مهمة البيت: ${esc(homeTask(L).replace(/^مهمة البيت: ?/, ''))}</span>` : ''}</div>`).join('') || '<br>تظهر هنا بعد أول درس.'}</div>
    <div class="card"><b>المراجعة المتباعدة</b> (بعد ١ و٣ و٧ و٢١ يوماً من الإتقان، والخطأ يعيدها إلى البداية):${Object.keys(PROG.srs).length ? `<table><thead><tr><th>الدرس</th><th>المرحلة</th><th>الموعد</th></tr></thead><tbody>${Object.entries(PROG.srs).map(([id, r]) => { const L = LESSONS.find(x => x.id === id); if (!L) return ''; const d = r.due ? Math.ceil((r.due - Date.now()) / DAY) : null;
      return `<tr><td>${plain(L.title)}</td><td>${DG(Math.min(r.step, 4))} من ${DG(4)}</td><td>${r.due == null ? '<span class="pill good">ثابت</span>' : d <= 0 ? '<span class="pill think">اليوم</span>' : 'بعد ' + DG(d) + (d === 1 ? ' يوم' : ' أيام')}</td></tr>`; }).join('')}</tbody></table>` : '<br>تبدأ بعد أول درس متقن.'}</div>
    <div class="card"><b>حدّ الجلسة:</b> عدد الدروس قبل أن يقترح فرجار استراحة (المراجعة القصيرة لا تُحسب). الدرس نحو ١٥–٢٠ دقيقة.
      <div class="seg" id="segMax">${[1, 2, 3, 0].map(n => `<button class="pick" data-n="${n}" aria-pressed="${SET.sessionMax === n}">${n ? DG(n) + (n === 1 ? ' درس' : ' دروس') : 'بلا حدّ'}</button>`).join('')}</div>
      <p style="margin:6px 0 0;color:var(--muted)">في هذه الجلسة: ${DG(sessionNow().n)} ${sessionNow().n === 1 ? 'درس' : 'دروس'}.</p></div>
    <div class="card"><b>الطالب:</b> ${PROFILE ? (PROFILE.gender === 'f' ? 'بنت' : 'ولد') : '—'} · الخطاب يتبع هذا الاختيار. <button class="pick" id="editProfile" style="min-height:44px;margin-top:6px">تعديل الاسم والجنس والصورة</button>
      <div style="margin-top:10px"><b>أطفال هذا الجهاز</b> (لكل طفل تقدّمه ومعرضه، ويختار الطفل صورته عند الدخول):</div>
      <div class="seg">${KIDS.map(k => `<span class="pill${k.id === KID ? ' good' : ''}">${esc(k.name)}</span>${k.id === KID ? '' : `<button class="pick" data-del="${k.id}">حذف ${esc(k.name)}</button>`}`).join(' ')}<button class="pick" id="addKid">إضافة طفل</button></div></div>
    <div class="card"><b>إشارات</b> (من آخر المحاولات):<br>${signals().map(([t, x]) => `<span class="pill think">${t}</span> ${x}`).join('<br>') || 'لا شيء يدعو للقلق.'}
      <div class="seg"><button class="pick" id="repBtn">تقرير الأسبوع للطباعة</button><button class="pick" id="slowBtn" aria-pressed="${!!SET.slow}">قراءة أبطأ: ${SET.slow ? 'تعمل' : 'متوقفة'}</button></div></div>
    <div class="card"><b>أصوات مسجّلة للتجربة:</b> ملفات MP3 اسم كل منها معرّف الجملة، مثل <code>m1.u1.d2.hook.01.mp3</code> أو <code>…_f.mp3</code> للصيغة المؤنثة.<br><input type="file" id="clipIn" accept="audio/*" multiple><div id="clipMsg" style="color:var(--muted)"></div></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="go" id="closePanel" style="flex:1;min-width:140px">رجوع</button><button class="pick" id="unlockAll" style="min-width:140px">${PROG.unlockAll ? 'إعادة قفل الدروس' : 'فتح كل الدروس للتجربة'}</button><button class="pick" id="resetAll" style="min-width:140px">بدء كل الدروس من جديد</button></div></div>`;
  $('#panel').hidden = false;
  $('#closePanel').onclick = () => { $('#panel').hidden = true; };
  $('#editProfile').onclick = () => { $('#panel').hidden = true; openProfile(false); };
  $('#addKid').onclick = () => { $('#panel').hidden = true; openProfile(true); };
  $('#panel').querySelectorAll('[data-del]').forEach(b => b.onclick = () => { if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = 'متأكد؟ يُحذف تقدّمه كله'; return; }
    const id = b.dataset.del; for (const key of ['hp_prog', 'hp_log', 'hp_session', 'hp_settings', 'hp_designs']) { try { localStorage.removeItem(key + ':' + id); } catch (e) {} }
    KIDS.splice(KIDS.findIndex(k => k.id === id), 1); store.set('hp_kids', KIDS); openPanel(); });
  $('#repBtn').onclick = () => weeklyReport();
  $('#slowBtn').onclick = () => { SET.slow = !SET.slow; saveSet(); openPanel(); };
  $('#segMax').querySelectorAll('.pick').forEach(b => b.onclick = () => { SET.sessionMax = +b.dataset.n; saveSet(); openPanel(); });
  $('#unlockAll').onclick = () => { if (PROG.unlockAll) delete PROG.unlockAll; else PROG.unlockAll = true; saveProg(); $('#panel').hidden = true; showHome(); };
  $('#resetAll').onclick = () => { for (const k of Object.keys(PROG)) delete PROG[k]; PROG.srs = {}; SESSION = { n: 0, t: 0 }; store.set(kk('hp_session'), SESSION); saveProg(); LOG.attempts = []; store.set(kk('hp_log'), LOG); store.set(designsKey(), []); IDB.clear(); $('#panel').hidden = true; showHome(); };
  $('#clipIn').onchange = e => { let n = 0; for (const f of e.target.files) { CLIPS[f.name.replace(/\.(mp3|m4a|wav|ogg)$/i, '')] = URL.createObjectURL(f); n++; } $('#clipMsg').textContent = 'أُضيف ' + DG(n) + ' ملفاً.'; };
}
$('#adultBtn').onclick = () => { stopVoice(); adultGate(openPanel); };

/* البداية */
defs(); renderDigits();
{ const f = el('svg', { viewBox: '0 0 360 120', preserveAspectRatio: 'xMidYMax slice' }); skyline(f, { y: 108, h: 100, n: 7, opacity: 1 }); el('rect', { x: 0, y: 106, width: 360, height: 14, fill: css('--ground') }, f); $('#cityfloor').appendChild(f); } try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', defs); } catch (e) {}
renderMute();
if (!PROFILE) openProfile(true); else if (KIDS.length > 1) { showHome(); openKids(true); } else showHome();
</script>
